<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Watch Face Designer</title>
<style>
  body { font-family: system-ui, sans-serif; background:#1a1a1a; color:#e0e0e0;
         margin:0; padding:20px; display:flex; gap:20px; }
  #canvasWrap { background:#000; padding:8px; border-radius:6px; display:inline-block; }
  canvas { image-rendering: pixelated; display:block; cursor: crosshair; }
  .panel { min-width: 220px; }
  button { display:block; width:100%; margin:6px 0; padding:8px; font-size:14px;
           background:#333; color:#e0e0e0; border:1px solid #555; border-radius:4px;
           cursor:pointer; }
  button:hover:not(:disabled) { background:#444; }
  button:disabled { opacity:0.4; cursor:not-allowed; }
  h2 { margin-top:0; font-size:14px; text-transform:uppercase; letter-spacing:1px;
       color:#888; }
  h2:not(:first-child) { margin-top:20px; }
  #status, #connStatus { font-size:12px; color:#888; margin-top:8px; }
  #connStatus.connected { color:#6c6; }
  #connStatus.error     { color:#c66; }
</style>
</head>
<body>

<div id="canvasWrap">
  <canvas id="c"></canvas>
</div>

<div class="panel">
  <h2>Connection</h2>
  <button id="btnConnect">Connect to Watch</button>
  <button id="btnSend" disabled>Send to Watch</button>
  <div id="connStatus">Not connected</div>

  <h2>Tools</h2>
  <button id="btnClear">Clear</button>
  <button id="btnInvert">Invert</button>
  <button id="btnUndo">Undo</button>
  <button id="btnDemo">Load demo pattern</button>

  <div id="status">—</div>
</div>

<script>
// ============================================================
// Screen config (must match the watch)
// ============================================================
const W = 32;         // logical width in pixels
const H = 128;        // logical height in pixels
const SCALE = 6;      // display zoom (6x -> 192 x 768)

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width  = W * SCALE;
canvas.height = H * SCALE;

// ============================================================
// Pixel buffer
// ============================================================
let pixels = new Uint8Array(W * H);
let undoStack = [];

function idx(x, y) { return y * W + x; }

function render() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#ffffff';
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      if (pixels[idx(x, y)]) {
        ctx.fillRect(x * SCALE, y * SCALE, SCALE, SCALE);
      }
    }
  }

  // Faint grid every 8 pixels
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 8) {
    ctx.beginPath();
    ctx.moveTo(x * SCALE + 0.5, 0);
    ctx.lineTo(x * SCALE + 0.5, canvas.height);
    ctx.stroke();
  }
  for (let y = 0; y <= H; y += 8) {
    ctx.beginPath();
    ctx.moveTo(0, y * SCALE + 0.5);
    ctx.lineTo(canvas.width, y * SCALE + 0.5);
    ctx.stroke();
  }

  updateStatus();
}

function updateStatus() {
  let count = 0;
  for (let i = 0; i < pixels.length; i++) if (pixels[i]) count++;
  document.getElementById('status').textContent =
    `${W}×${H} • ${count} px on • zoom ${SCALE}×`;
}

// ============================================================
// Drawing
// ============================================================
let mouseDown = false;
let paintValue = 1;
let lastCell = null;

function cellFromEvent(e) {
  const r = canvas.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) / SCALE);
  const y = Math.floor((e.clientY - r.top)  / SCALE);
  if (x < 0 || x >= W || y < 0 || y >= H) return null;
  return { x, y };
}

function paint(cell) {
  if (!cell) return;
  const i = idx(cell.x, cell.y);
  if (pixels[i] === paintValue) return;
  pixels[i] = paintValue;
  ctx.fillStyle = paintValue ? '#ffffff' : '#000';
  ctx.fillRect(cell.x * SCALE, cell.y * SCALE, SCALE, SCALE);
  updateStatus();
}

function pushUndo() {
  undoStack.push(new Uint8Array(pixels));
  if (undoStack.length > 50) undoStack.shift();
}

canvas.addEventListener('mousedown', e => {
  mouseDown = true;
  pushUndo();
  const cell = cellFromEvent(e);
  if (!cell) return;
  paintValue = pixels[idx(cell.x, cell.y)] ? 0 : 1;
  lastCell = null;
  paint(cell);
});

canvas.addEventListener('mousemove', e => {
  if (!mouseDown) return;
  const cell = cellFromEvent(e);
  if (!cell) return;
  if (lastCell && (cell.x !== lastCell.x || cell.y !== lastCell.y)) {
    lineTo(lastCell, cell);
  } else {
    paint(cell);
  }
  lastCell = cell;
});

function lineTo(a, b) {
  let x0 = a.x, y0 = a.y;
  const x1 = b.x, y1 = b.y;
  const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1;
  const dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  while (true) {
    paint({ x: x0, y: y0 });
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}

canvas.addEventListener('mouseup',    () => { mouseDown = false; lastCell = null; });
canvas.addEventListener('mouseleave', () => { mouseDown = false; lastCell = null; });

// ============================================================
// Tool buttons
// ============================================================
document.getElementById('btnClear').onclick = () => {
  pushUndo();
  pixels.fill(0);
  render();
};

document.getElementById('btnInvert').onclick = () => {
  pushUndo();
  for (let i = 0; i < pixels.length; i++) pixels[i] ^= 1;
  render();
};

document.getElementById('btnUndo').onclick = () => {
  if (!undoStack.length) return;
  pixels = undoStack.pop();
  render();
};

document.getElementById('btnDemo').onclick = () => {
  pushUndo();
  pixels.fill(0);
  for (let x = 0; x < W; x++) { pixels[idx(x, 0)] = 1; pixels[idx(x, H - 1)] = 1; }
  for (let y = 0; y < H; y++) { pixels[idx(0, y)] = 1; pixels[idx(W - 1, y)] = 1; }
  render();
};

// ============================================================
// BLE
// ============================================================
const SERVICE = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const RX_CHAR = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';

let bleDevice = null;
let bleServer = null;
let bleRxChar = null;
let bleConnected = false;

const btnConnect = document.getElementById('btnConnect');
const btnSend    = document.getElementById('btnSend');
const connStatus = document.getElementById('connStatus');

function setConnUI(state, msg) {
  connStatus.classList.remove('connected', 'error');
  connStatus.textContent = msg;

  if (state === 'disconnected') {
    btnConnect.textContent = 'Connect to Watch';
    btnConnect.disabled = false;
    btnSend.disabled = true;
    bleConnected = false;
  } else if (state === 'connecting') {
    btnConnect.textContent = 'Connecting…';
    btnConnect.disabled = true;
    btnSend.disabled = true;
    bleConnected = false;
  } else if (state === 'connected') {
    btnConnect.textContent = 'Disconnect';
    btnConnect.disabled = false;
    btnSend.disabled = false;
    bleConnected = true;
    connStatus.classList.add('connected');
  } else if (state === 'error') {
    btnConnect.textContent = 'Connect to Watch';
    btnConnect.disabled = false;
    btnSend.disabled = true;
    bleConnected = false;
    connStatus.classList.add('error');
  }
}

async function doConnect() {
  if (!navigator.bluetooth) {
    setConnUI('error', 'Web Bluetooth not supported in this browser');
    return;
  }
  try {
    setConnUI('connecting', 'Requesting device…');
    bleDevice = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE] }],
      optionalServices: [SERVICE]
    });

    bleDevice.addEventListener('gattserverdisconnected', () => {
      bleServer = null;
      bleRxChar = null;
      setConnUI('disconnected', 'Disconnected');
    });

    setConnUI('connecting', 'Connecting…');
    bleServer = await bleDevice.gatt.connect();

    setConnUI('connecting', 'Finding service…');
    const service = await bleServer.getPrimaryService(SERVICE);

    setConnUI('connecting', 'Finding characteristic…');
    bleRxChar = await service.getCharacteristic(RX_CHAR);

    setConnUI('connected', `Connected: ${bleDevice.name || 'watch'}`);
  } catch (e) {
    console.error(e);
    setConnUI('error', `Error: ${e.message}`);
  }
}

function doDisconnect() {
  try {
    if (bleDevice && bleDevice.gatt.connected) bleDevice.gatt.disconnect();
  } catch (_) {}
  setConnUI('disconnected', 'Disconnected');
}

btnConnect.onclick = () => {
  if (bleConnected) doDisconnect();
  else doConnect();
};

// ============================================================
// Face encoding (pixel buffer -> JSON with base64-packed data)
// ============================================================
function buildFaceJson() {
  const bytesPerRow = Math.ceil(W / 8);
  const packed = new Uint8Array(bytesPerRow * H);

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      if (pixels[idx(x, y)]) {
        const byteIndex = y * bytesPerRow + (x >> 3);
        const bitIndex  = x & 7;          // LSB-first within each byte
        packed[byteIndex] |= (1 << bitIndex);
      }
    }
  }

  let binary = '';
  for (let i = 0; i < packed.length; i++) binary += String.fromCharCode(packed[i]);
  const b64 = btoa(binary);

  return JSON.stringify({
    v: 1,
    name: "untitled",
    w: W,
    h: H,
    format: "bitpacked-row-lsb",
    overlays: false,   
    data: b64
  });
}

// ============================================================
// Send face to watch
// ============================================================
const CHUNK_SIZE = 180;   // safe for typical 185–247 MTU after ATT overhead

async function sendFaceToWatch() {
  if (!bleConnected || !bleRxChar) throw new Error('Not connected');

  const faceJson = buildFaceJson();
  const payload  = new TextEncoder().encode(faceJson);

  if (payload.length > 0xFFFF) throw new Error('Face too large (>64 KB)');

  // 2-byte little-endian length header, then payload
  const frame = new Uint8Array(2 + payload.length);
  frame[0] = payload.length & 0xFF;
  frame[1] = (payload.length >> 8) & 0xFF;
  frame.set(payload, 2);

  let sent = 0;
  while (sent < frame.length) {
    const slice = frame.slice(sent, sent + CHUNK_SIZE);
    // writeValueWithoutResponse is faster; fall back handled by browser if unsupported
    if (bleRxChar.writeValueWithoutResponse) {
      await bleRxChar.writeValueWithoutResponse(slice);
    } else {
      await bleRxChar.writeValue(slice);
    }
    sent += slice.length;
    connStatus.textContent = `Sending… ${sent}/${frame.length}`;
  }

  connStatus.textContent = `Sent ${payload.length} bytes (${frame.length} on wire)`;
}

btnSend.onclick = async () => {
  try {
    btnSend.disabled = true;
    connStatus.classList.remove('error');
    await sendFaceToWatch();
    connStatus.classList.add('connected');
  } catch (e) {
    console.error(e);
    setConnUI('connected', `Send error: ${e.message}`);
    connStatus.classList.remove('connected');
    connStatus.classList.add('error');
  } finally {
    btnSend.disabled = false;
  }
};

// ============================================================
// Init
// ============================================================
render();
</script>

</body>
</html>
