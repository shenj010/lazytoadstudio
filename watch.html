<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Watch Designer</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif;
    background: #1a1a1a; color: #e0e0e0;
    margin: 0; padding: 0;
    display: flex; flex-direction: column;
    min-height: 100vh;
    overscroll-behavior: none;   /* prevent pull-to-refresh and bounce */
  }

  header {
    display: flex; align-items: center; gap: 20px;
    padding: 12px 20px;
    border-bottom: 1px solid #333;
    background: #222;
  }
  .tabs { display: flex; gap: 4px; }
  .tabs button {
    width: auto; margin: 0;
    padding: 8px 18px;
    background: transparent; color: #888;
    border: 1px solid #444; border-radius: 4px;
    cursor: pointer;
  }
  .tabs button.active {
    background: #3a3a3a; color: #fff; border-color: #666;
  }
  .conn {
    margin-left: auto; display: flex; align-items: center; gap: 10px;
  }
  .conn button {
    width: auto; margin: 0;
    padding: 8px 14px;
  }
  #connStatus { font-size: 12px; color: #888; }
  #connStatus.connected { color: #6c6; }
  #connStatus.error     { color: #c66; }

  main {
    flex: 1;
    display: flex; gap: 20px;
    padding: 20px;
    align-items: flex-start;
  }

  aside { min-width: 220px; max-width: 260px; }

  #canvasWrap {
    background: #000; padding: 8px; border-radius: 6px;
    display: inline-block;
  }
  canvas {
  image-rendering: pixelated; display: block;
  cursor: crosshair;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;   /* prevents iOS long-press popup */
}
  canvas.face-mode { cursor: default; }

  button {
    display: block; width: 100%; margin: 6px 0;
    padding: 8px; font-size: 14px;
    background: #333; color: #e0e0e0;
    border: 1px solid #555; border-radius: 4px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: #444; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  h2 {
    margin-top: 0; font-size: 14px;
    text-transform: uppercase; letter-spacing: 1px;
    color: #888;
  }
  h2:not(:first-child) { margin-top: 20px; }

  #status { font-size: 12px; color: #888; margin-top: 12px; }
  #propsEmpty { font-size: 12px; color: #666; }

  .checkbox-row {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 0; font-size: 13px; color: #ccc;
    cursor: pointer;
  }
  .checkbox-row input { margin: 0; cursor: pointer; }

  .prop-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px 0; font-size: 13px;
    border-bottom: 1px solid #2a2a2a;
  }
  .prop-row label { color: #888; }
  .prop-row span  { color: #e0e0e0; font-variant-numeric: tabular-nums; }

  .prop-row input,
  .prop-row select {
    background: #222; color: #e0e0e0;
    border: 1px solid #444; border-radius: 3px;
    padding: 2px 6px; font-size: 13px;
    width: 70px; text-align: right;
  }
  .prop-row select { width: 120px; text-align: left; }

  #timeline {
    width: 192px;
    box-sizing: border-box;
    margin-top: 10px;
    padding: 8px;
    background: #111;
    border-radius: 4px;
    border-top: 1px solid #2a2a2a;
  }
  #timelineFrames {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    padding: 4px 0;
    min-height: 60px;
    width: 100%;
    box-sizing: border-box;
  }
  #timelineFrames::-webkit-scrollbar {
    height: 6px;
  }
  #timelineFrames::-webkit-scrollbar-thumb {
    background: #444;
    border-radius: 3px;
  }
  .timeline-thumb {
    width: 32px;
    height: 128px;
    flex-shrink: 0;
    border: 2px solid #333;
    border-radius: 2px;
    cursor: pointer;
    background: #000;
    display: flex;
    flex-direction: column;
  }
  .timeline-thumb.selected {
    border-color: #3af;
  }
  .timeline-thumb canvas {
    width: 100%;
    flex: 1;
    image-rendering: pixelated;
    display: block;
  }
  .timeline-thumb .thumb-label {
    font-size: 9px;
    text-align: center;
    color: #666;
    padding: 1px 0;
    background: #181818;
  }
  .timeline-thumb.selected .thumb-label {
    color: #3af;
  }
  #timelineControls {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 6px;
  min-height: 30px;
}
  #timelineControls button {
  flex: 0 0 auto;   /* don't grow, don't shrink */
  width: 76px;
  padding: 6px 0;
  text-align: center;
}
  #timelineInfo {
    font-size: 11px;
    color: #888;
    margin-top: 6px;
  }
  #btnPlayAnim {
  min-width: 84px;
  text-align: center;
}
   #toolGrid, #brushSizes {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
  }
  #brushSizes {
    grid-template-columns: repeat(4, 1fr);
  }
  #toolGrid button, #brushSizes button {
    margin: 0;
    padding: 8px 0;
    font-size: 16px;
    line-height: 1;
    text-align: center;
    width: auto;
  }
  #brushSizes button {
    font-size: 12px;
    padding: 6px 0;
  }
  #toolGrid button.active, #brushSizes button.active {
    background: #2a4a6a;
    border-color: #3af;
    color: #fff;
  }
   /* -------- Import panel -------- */
  #importPanel {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 8px;
    background: #161616;
    border: 1px solid #2a2a2a;
    border-radius: 4px;
    font-size: 12px;
  }
  #importPanel h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #666;
    margin: 6px 0 2px 0;
    font-weight: normal;
  }
  .import-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
  }
  .import-row label { color: #888; }
  .import-row input[type="number"] {
    width: 52px;
    background: #222;
    color: #e0e0e0;
    border: 1px solid #444;
    border-radius: 3px;
    padding: 2px 4px;
    font-size: 12px;
    text-align: right;
  }
  .import-row input[type="range"] { width: 90px; }
  .import-row select {
    background: #222;
    color: #e0e0e0;
    border: 1px solid #444;
    border-radius: 3px;
    padding: 2px 4px;
    font-size: 12px;
    flex: 1;
  }
  #importFile {
    width: 100%;
    font-size: 11px;
    color: #888;
  }
  #importFilmstrip {
    display: flex;
    gap: 2px;
    flex-wrap: wrap;
    padding: 4px;
    background: #0a0a0a;
    border: 1px solid #2a2a2a;
    border-radius: 3px;
    min-height: 40px;
    max-height: 160px;
    overflow-y: auto;
  }
  #importFilmstrip canvas {
    border: 1px solid #222;
    image-rendering: pixelated;
  }
  #importStatus {
    font-size: 11px;
    color: #888;
    min-height: 14px;
    line-height: 1.3;
  }
  #importButtons {
    display: flex;
    gap: 6px;
    margin-top: 4px;
  }
  #importButtons button {
    flex: 1;
    margin: 0;
    padding: 6px 4px;
    font-size: 12px;
  }
  #btnImportReplace {
    background: #2a4a2a;
    border-color: #4a6a4a;
    color: #cfc;
  }
  #btnImportCancel {
    background: #2a2a2a;
    border-color: #444;
  }
 /* -------- Library modal -------- */
#libraryOverlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}
#libraryOverlay.open {
  display: flex;
}
#libraryPanel {
  background: #1e1e1e;
  border: 1px solid #444;
  border-radius: 8px;
  width: min(560px, 90vw);
  max-height: 80vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 8px 32px rgba(0,0,0,0.6);
}
#libraryHeader {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid #333;
}
#libraryHeader h2 {
  margin: 0;
  font-size: 15px;
  color: #e0e0e0;
  letter-spacing: 0.5px;
  text-transform: none;
}
#libraryClose {
  width: auto;
  margin: 0;
  padding: 4px 12px;
  background: #333;
  border: 1px solid #555;
  font-size: 16px;
  line-height: 1;
}
#libraryTabs {
  display: flex;
  border-bottom: 1px solid #333;
}
#libraryTabs button {
  flex: 1;
  width: auto;
  margin: 0;
  border: none;
  border-radius: 0;
  border-bottom: 2px solid transparent;
  background: transparent;
  padding: 10px;
  color: #888;
  font-size: 13px;
}
#libraryTabs button.active {
  color: #fff;
  border-bottom-color: #3af;
  background: #252525;
}
#libraryBody {
  padding: 14px 18px;
  overflow-y: auto;
  flex: 1;
}
#libraryActions {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}
#libraryActions button {
  flex: 0 0 auto;
  width: auto;
  margin: 0;
  padding: 6px 12px;
  font-size: 12px;
  background: #2a3a5a;
  border-color: #4a6a8a;
  color: #cce;
}
#libraryActions button.secondary {
  background: #2a2a2a;
  border-color: #444;
  color: #ccc;
}
#libraryList {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.library-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  background: #161616;
  border: 1px solid #2a2a2a;
  border-radius: 4px;
  font-size: 13px;
}
.library-item-name {
  flex: 1;
  color: #e0e0e0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.library-item-meta {
  color: #666;
  font-size: 11px;
}
.library-item button {
  width: auto;
  margin: 0;
  padding: 4px 10px;
  font-size: 11px;
  background: #333;
  border: 1px solid #555;
}
.library-item button.danger {
  background: #3a1e1e;
  border-color: #633;
  color: #fbb;
}
#libraryEmpty {
  text-align: center;
  color: #555;
  padding: 40px 0;
  font-size: 13px;
}
</style>
<script src="glcdfont.js"></script>
</head>
<body>

<header>
    <div class="tabs">
    <button data-mode="face" class="active">Watch Face</button>
    <button data-mode="anim">Animation</button>
  </div>
  <button id="btnLibrary" style="width:auto;margin-left:12px;padding:8px 14px;background:#2a3a5a;border-color:#4a6a8a;color:#cce">Library</button>
  <div class="conn">
    <button id="btnConnect">Connect to Watch</button>
    <button id="btnSend" disabled>Send to Watch</button>
    <span id="connStatus">Not connected</span>
  </div>
</header>

<main>
  <aside id="palette">
    <h2>Palette</h2>
    <div id="paletteBody"></div>
  </aside>

  <section id="canvasWrap">
    <canvas id="c"></canvas>
    <div id="timeline" style="display:none">
      <div id="timelineFrames"></div>
      <div id="timelineControls">
        <button id="btnPlayAnim">▶ Play</button>
        <button id="btnAddFrame">+ Frame</button>
        <button id="btnDupFrame">Duplicate</button>
        <button id="btnDelFrame">Delete</button>
      </div>
      <div id="timelineInfo">—</div>
    </div>
  </section>

  <aside id="props">
    <h2>Properties</h2>
    <div id="propsBody"><div id="propsEmpty">Nothing selected</div></div>
    <div id="effectsBox" style="display:none">
      <h2>Face Effects</h2>
      <label class="checkbox-row">
        <input type="checkbox" id="fxScanline"> Scanline
      </label>
      <label class="checkbox-row">
        <input type="checkbox" id="fxGlitch"> Glitch
      </label>
      <label class="checkbox-row">
        <input type="checkbox" id="fxJitter"> Jitter
      </label>
      <label class="checkbox-row">
        <input type="checkbox" id="fxCorners" checked> Corner brackets
      </label>
      <label class="checkbox-row">
        <input type="checkbox" id="fxStatus"> Status bar
      </label>
      <label class="checkbox-row">
        <input type="checkbox" id="fxAd" checked> Ad override
      </label>
    </div>
    <div id="status">—</div>
  </aside>
</main>

<script>
// ============================================================
// Screen config
// ============================================================
const W = 32;
const H = 128;
const SCALE = 6;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width  = W * SCALE;
canvas.height = H * SCALE;

let currentMode = 'face';

// ============================================================
// ANIMATION STATE
// ============================================================
// Animation state
let frames = [{ durationMs: 100, pixels: new Uint8Array(W * H) }];
let currentFrameIndex = 0;
let defaultFrameMs = 100;
let animationPlaying = false;
let animationPlayStart = 0;
let animationPlayHandle = null;
let loopCount = 1;   // applies to whatever animation is sent next
let currentBackgroundFrames = null;   // array of Uint8Array(32*128)
let currentBackgroundFrameMs = 100;

// `pixels` is an alias for the current frame's pixel buffer.
// All existing drawing code operates on this and works unchanged.
let pixels = frames[0].pixels;
let undoStack = [];
// Drawing tool state
let currentTool = 'pencil';
let brushSize = 1;
// Preview overlay for shape tools (line, rect, circle)
let previewPixels = new Uint8Array(W * H);
let shapeStart = null;      // { x, y } on mousedown
let shapeEnd = null;        // { x, y } on mousemove
let shapeActive = false;

function idx(x, y) { return y * W + x; }

// ============================================================
// FACE STATE
// ============================================================
let elements = [
  { id: 1, type: 'time',    style: '7seg',     x: 0,  y: 2,   w: 32, h: 56, thick: 3 },
  { id: 2, type: 'date',    style: 'microhex', format: 'MMDD', scale: 2, x: 0, y: 64, w: 26, h: 16 },
  { id: 3, type: 'weekday',                     x: 0,  y: 88,  w: 16, h: 16 },
  { id: 4, type: 'weather',                     x: 16, y: 88,  w: 16, h: 16 },
  { id: 5, type: 'temp',    style: 'microhex', scale: 2, x: 0, y: 108, w: 26, h: 16 },
];
let selectedId = null;
let nextId = 6;

let effects = {
  scanline: false,
  glitch: false,
  jitter: false,
  corners: true,
  status: false,
  ad: true,
};

let scanY = 0;

// ============================================================
// Fonts
// ============================================================
const MHEX_GLYPHS = [
  [0x3C,0x4A,0x52,0x62,0x42,0x3C],
  [0x00,0x22,0x7E,0x02,0x00,0x00],
  [0x26,0x4A,0x4A,0x4A,0x52,0x24],
  [0x24,0x42,0x4A,0x4A,0x4A,0x34],
  [0x18,0x28,0x48,0x7E,0x08,0x08],
  [0x72,0x52,0x52,0x52,0x52,0x5E],
  [0x3C,0x52,0x52,0x52,0x52,0x0C],
  [0x40,0x40,0x46,0x58,0x60,0x40],
  [0x2C,0x52,0x52,0x52,0x52,0x2C],
  [0x20,0x52,0x52,0x52,0x52,0x3C],
];
const MHEX_WIDTH = 6;
const MHEX_HEIGHT = 8;

const SEG_MAP = [
  0b0111111, 0b0000110, 0b1011011, 0b1001111, 0b1100110,
  0b1101101, 0b1111101, 0b0000111, 0b1111111, 0b1101111
];

 // ============================================================
// Kanji bitmaps (16x16, Adafruit drawBitmap format: row-major, MSB first)
// ============================================================
const KANJI_SUN    = [0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x07,0xE0,0x04,0x20,0x04,0x20,0x07,0xE0,0x04,0x20,0x04,0x20,0x07,0xE0,0x04,0x20,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00];

const KANJI_SUNNY  = [0x00,0x00,0x01,0x00,0x01,0x00,0x18,0x10,0x01,0x10,0x07,0xC0,0x07,0xC0,0x6F,0xEC,0x07,0xC0,0x07,0xC0,0x11,0x00,0x10,0x30,0x01,0x00,0x01,0x00,0x00,0x00,0x00,0x00];

const KANJI_SUMMER = [0x00,0x00,0x00,0x00,0x00,0x00,0x0F,0xF0,0x04,0x20,0x07,0xE0,0x04,0x20,0x07,0xE0,0x03,0xC0,0x0E,0x40,0x03,0xC0,0x1C,0x30,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00];
const KANJI_AUTUMN = [0x00,0x00,0x00,0x00,0x00,0x00,0x02,0x80,0x1C,0x80,0x04,0xA0,0x1D,0xA0,0x04,0xA0,0x0C,0x80,0x15,0x40,0x05,0x40,0x05,0x20,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00];
const KANJI_WINTER = [0x00,0x00,0x00,0x00,0x00,0x00,0x03,0x00,0x03,0xE0,0x04,0x20,0x1A,0x40,0x01,0x80,0x02,0x60,0x1D,0x18,0x00,0xC0,0x06,0x00,0x01,0xE0,0x00,0x00,0x00,0x00,0x00,0x00];

const WEEKDAY_KANJI = [KANJI_SUN, KANJI_MON, KANJI_TUE, KANJI_WED, KANJI_THU, KANJI_FRI, KANJI_SAT];
const WEATHER_KANJI = [KANJI_SUNNY, KANJI_CLOUD, KANJI_RAINY, KANJI_SPRING, KANJI_SUMMER, KANJI_AUTUMN, KANJI_WINTER];

function scaleFromHeight(boxHeight, glyphHeight) {
  const s = Math.floor(boxHeight / glyphHeight);
  return Math.max(1, s);
}

// ============================================================
// Low-level pixel writes
// ============================================================
function fillRectPx(x, y, w, h) {
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(x * SCALE, y * SCALE, w * SCALE, h * SCALE);
}

function drawPixelPx(x, y) {
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(x * SCALE, y * SCALE, SCALE, SCALE);
}

function switchToFrame(i) {
  if (animationPlaying) stopAnimation();
  if (i < 0 || i >= frames.length) return;
  currentFrameIndex = i;
  pixels = frames[i].pixels;
  render();
  renderTimeline();
}

function addFrame() {
  if (frames.length >= AD_MAX_FRAMES) {
    alert(`Frame limit reached (${AD_MAX_FRAMES} frames = 5s @ 8fps). Delete some frames first.`);
    return;
  }
  frames.push({ durationMs: defaultFrameMs, pixels: new Uint8Array(W * H) });
  switchToFrame(frames.length - 1);
  renderTimeline();
  rebuildProps();
}

function duplicateFrame() {
  if (frames.length >= AD_MAX_FRAMES) {
    alert(`Frame limit reached (${AD_MAX_FRAMES} frames). Delete some frames first.`);
    return;
  }
  const cur = frames[currentFrameIndex];
  const copy = { durationMs: cur.durationMs, pixels: new Uint8Array(cur.pixels) };
  frames.splice(currentFrameIndex + 1, 0, copy);
  switchToFrame(currentFrameIndex + 1);
  renderTimeline();
  rebuildProps();
}

function deleteFrame() {
  if (frames.length <= 1) return;
  frames.splice(currentFrameIndex, 1);
  if (currentFrameIndex >= frames.length) currentFrameIndex = frames.length - 1;
  switchToFrame(currentFrameIndex);
  renderTimeline();
  rebuildProps();
}

function playAnimation() {
  if (animationPlaying) {
    stopAnimation();
    return;
  }
  animationPlaying = true;
  animationPlayStart = performance.now();
  document.getElementById('btnPlayAnim').textContent = '■ STOP';
  animationPlayHandle = requestAnimationFrame(animationLoop);
}

function stopAnimation() {
  animationPlaying = false;
  if (animationPlayHandle) {
    cancelAnimationFrame(animationPlayHandle);
    animationPlayHandle = null;
  }
  document.getElementById('btnPlayAnim').textContent = '▶ PLAY';
  render();   // restore the actual current frame
}

function animationLoop() {
  if (!animationPlaying) return;

  const elapsed = performance.now() - animationPlayStart;
  const totalMs = frames.reduce((a, f) => a + f.durationMs, 0);
  if (totalMs <= 0) { stopAnimation(); return; }

  const t = elapsed % totalMs;

  let cumulative = 0;
  let shownFrame = 0;
  for (let i = 0; i < frames.length; i++) {
    cumulative += frames[i].durationMs;
    if (t < cumulative) { shownFrame = i; break; }
  }

  drawPreviewFrame(shownFrame);
  animationPlayHandle = requestAnimationFrame(animationLoop);
}

function drawPreviewFrame(i) {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const px = frames[i].pixels;
  ctx.fillStyle = '#ffffff';
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      if (px[y * W + x]) {
        ctx.fillRect(x * SCALE, y * SCALE, SCALE, SCALE);
      }
    }
  }
}

function renderTimeline() {
  const wrap = document.getElementById('timelineFrames');
  if (!wrap) return;
  wrap.innerHTML = '';

  for (let i = 0; i < frames.length; i++) {
    const div = document.createElement('div');
    div.className = 'timeline-thumb' + (i === currentFrameIndex ? ' selected' : '');

    const c = document.createElement('canvas');
    c.width = W;
    c.height = H;
    const cctx = c.getContext('2d');
    const img = cctx.createImageData(W, H);
    const px = frames[i].pixels;
    for (let p = 0; p < W * H; p++) {
      const on = px[p];
      img.data[p * 4 + 0] = on ? 255 : 0;
      img.data[p * 4 + 1] = on ? 255 : 0;
      img.data[p * 4 + 2] = on ? 255 : 0;
      img.data[p * 4 + 3] = 255;
    }
    cctx.putImageData(img, 0, 0);
    div.appendChild(c);

    const label = document.createElement('div');
    label.className = 'thumb-label';
    label.textContent = i;
    div.appendChild(label);

    div.onclick = () => {
      switchToFrame(i);
      renderTimeline();
      rebuildProps();
    };

    wrap.appendChild(div);
  }

  // Update info line
  const totalMs = frames.reduce((a, f) => a + f.durationMs, 0);
  const info = document.getElementById('timelineInfo');
  if (info) {
        const perLoopMs = frames.reduce((a, f) => a + f.durationMs, 0);
    const totalPlayMs = perLoopMs * loopCount;
    const over = totalPlayMs > 30000;
    info.textContent =
      `${frames.length} frame${frames.length === 1 ? '' : 's'} · ` +
      `${perLoopMs}ms/loop × ${loopCount} = ${(totalPlayMs / 1000).toFixed(2)}s` +
      (over ? ' (over 30s!)' : '');
    info.style.color = over ? '#c66' : '#888';
  }
}

// ============================================================
// 7-segment renderer
// ============================================================
function draw7SegDigit(x, y, w, h, thick, d) {
  if (d < 0 || d > 9) return;
  const mask = SEG_MAP[d];
  const midY = y + Math.floor(h / 2);

  let upperLen = Math.floor(h / 2) - thick - 1;
  if (upperLen < 0) upperLen = 0;
  const lowerLen = upperLen;

  const hSeg = (yy) => fillRectPx(x, yy, w, thick);
  const vSeg = (xx, yy, len) => { if (len > 0) fillRectPx(xx, yy, thick, len); };

  if (mask & (1 << 0)) hSeg(y);
  if (mask & (1 << 6)) hSeg(midY - Math.floor(thick / 2));
  if (mask & (1 << 3)) hSeg(y + h - thick);

  if (mask & (1 << 5)) vSeg(x, y + thick, upperLen);
  if (mask & (1 << 1)) vSeg(x + w - thick, y + thick, upperLen);
  if (mask & (1 << 4)) vSeg(x, midY + Math.floor(thick / 2), lowerLen);
  if (mask & (1 << 2)) vSeg(x + w - thick, midY + Math.floor(thick / 2), lowerLen);
}

// ============================================================
// Bitmap glyph renderer
// ============================================================
function drawMicroHexDigit(x, y, digit, scale) {
  if (digit < 0 || digit > 9) return;
  const cols = MHEX_GLYPHS[digit];
  drawGlyphColumns(x, y, cols, MHEX_WIDTH, MHEX_HEIGHT, scale);
}

function drawGlyphColumns(x, y, cols, w, h, scale) {
  for (let cx = 0; cx < w; cx++) {
    const col = cols[cx];
    let flipped = 0;
    for (let b = 0; b < h; b++) {
      if (col & (1 << b)) flipped |= (1 << (h - 1 - b));
    }
    for (let row = 0; row < h; row++) {
      if (flipped & (1 << row)) {
        fillRectPx(x + cx * scale, y + row * scale, scale, scale);
      }
    }
  }
}

function drawKanjiBitmap(x, y, bitmap, scale) {
  if (scale < 1) scale = 1;
  for (let cy = 0; cy < 16; cy++) {
    for (let cx = 0; cx < 16; cx++) {
      const bitIndex = cy * 16 + cx;
      const byteIdx = bitIndex >> 3;        // ÷ 8
      const bitPos = 7 - (bitIndex & 7);    // MSB first
      const b = bitmap[byteIdx];
      if (b & (1 << bitPos)) {
        fillRectPx(x + cx * scale, y + cy * scale, scale, scale);
      }
    }
  }
}

function scaleForBox(boxW, boxH, charW, charH, charCount) {
  const scaleH = Math.floor(boxH / charH);
  return Math.max(1, scaleH);
}

 function drawGLCDFontChar(x, y, code, scale) {
  if (code < 0 || code > 255) code = '?'.charCodeAt(0);
  const base = code * 5;
  for (let cx = 0; cx < 5; cx++) {
    const col = GLCDFONT[base + cx];
    for (let row = 0; row < 8; row++) {
      if (col & (1 << row)) {
        fillRectPx(x + cx * scale, y + row * scale, scale, scale);
      }
    }
  }
}

function drawTextElement(el) {
  const rot = el.rotation || 0;
  const content = el.content || 'Hello';
  const s = scaleFromHeight(el.h, 8);

  if (rot === 90 || rot === 270) {
    let yy = el.y;
    for (const ch of content) {
      drawGLCDFontChar(el.x, yy, ch.charCodeAt(0), s);
      yy += 8 * s;
    }
  } else {
    let xx = el.x;
    for (const ch of content) {
      drawGLCDFontChar(xx, el.y, ch.charCodeAt(0), s);
      xx += 6 * s;
    }
  }
}

function drawBackgroundElement(el) {
  if (!currentBackgroundFrames || currentBackgroundFrames.length === 0) {
    // No background loaded — draw a placeholder so the user knows it exists
    ctx.save();
    ctx.strokeStyle = 'rgba(120, 120, 120, 0.4)';
    ctx.setLineDash([4, 4]);
    ctx.strokeRect(el.x * SCALE + 0.5, el.y * SCALE + 0.5, el.w * SCALE, el.h * SCALE);
    ctx.fillStyle = 'rgba(120, 120, 120, 0.5)';
    ctx.font = '11px system-ui';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('no background loaded', (el.x + el.w / 2) * SCALE, (el.y + el.h / 2) * SCALE);
    ctx.restore();
    return;
  }

  // Draw the top-left (el.w × el.h) region of frame 0 at (el.x, el.y)
  const px = currentBackgroundFrames[0];
  ctx.fillStyle = '#ffffff';
  for (let y = 0; y < el.h && y < H; y++) {
    const srcY = y;               // source row within the bitmap
    if (srcY >= H) break;
    const dstY = el.y + y;
    if (dstY < 0 || dstY >= H) continue;

    for (let x = 0; x < el.w && x < W; x++) {
      const srcX = x;
      if (srcX >= W) break;
      const dstX = el.x + x;
      if (dstX < 0 || dstX >= W) continue;

      if (px[srcY * W + srcX]) {
        ctx.fillRect(dstX * SCALE, dstY * SCALE, SCALE, SCALE);
      }
    }
  }
}
// ============================================================
// FACE renderer
// ============================================================
function renderFace() {
  drawGrid();

  for (const el of elements) drawElement(el);

  if (selectedId !== null) {
    const el = elements.find(e => e.id === selectedId);
    if (el) drawSelectionOutline(el);
  }

  if (effects.scanline) drawScanline();
  if (effects.corners)  drawCornerBrackets();
  if (effects.status)   drawStatusBar();
}

const HANDLE_SIZE = 8;
const HANDLE_COLOR = '#3af';

function drawSelectionOutline(el) {
  const x = el.x * SCALE;
  const y = el.y * SCALE;
  const w = el.w * SCALE;
  const h = el.h * SCALE;

  ctx.save();
  ctx.strokeStyle = HANDLE_COLOR;
  ctx.lineWidth = 2;
  ctx.setLineDash([]);
  ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);

  const corners = [
    [x,     y    ],
    [x + w, y    ],
    [x,     y + h],
    [x + w, y + h],
  ];
  ctx.fillStyle = HANDLE_COLOR;
  for (const [cx, cy] of corners) {
    ctx.fillRect(
      cx - HANDLE_SIZE / 2,
      cy - HANDLE_SIZE / 2,
      HANDLE_SIZE,
      HANDLE_SIZE
    );
  }
  ctx.restore();
}

function drawGrid() {
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 8) {
    ctx.beginPath();
    ctx.moveTo(x * SCALE + 0.5, 0);
    ctx.lineTo(x * SCALE + 0.5, canvas.height);
    ctx.stroke();
  }
  for (let y = 0; y <= H; y += 8) {
    ctx.beginPath();
    ctx.moveTo(0, y * SCALE + 0.5);
    ctx.lineTo(canvas.width, y * SCALE + 0.5);
    ctx.stroke();
  }
}

// ---------- Effects ----------

function drawScanline() {
  fillRectPx(0, scanY, W, 1);
}

function drawCornerBrackets() {
  fillRectPx(0, 0, 8, 1);
  fillRectPx(0, 0, 1, 6);
  fillRectPx(W - 8, 0, 8, 1);
  fillRectPx(W - 1, 0, 1, 6);
  fillRectPx(0, H - 1, 8, 1);
  fillRectPx(0, H - 6, 1, 6);
  fillRectPx(W - 8, H - 1, 8, 1);
  fillRectPx(W - 1, H - 6, 1, 6);
}

function drawStatusBar() {
  drawTextSmall(0, 0, 'BAT');
  for (let i = 0; i < 3; i++) {
    fillRectPx(20 + i * 4, 0, 2, 5);
  }
  drawTextSmall(0, 6, 'SIG');
  for (let i = 0; i < 2; i++) {
    fillRectPx(20 + i * 4, 6, 2, 5);
  }
}

function drawTextSmall(x, y, str) {
  ctx.save();
  ctx.fillStyle = '#ffffff';
  ctx.font = '5px monospace';
  ctx.textBaseline = 'top';
  ctx.fillText(str, x * SCALE, y * SCALE);
  ctx.restore();
}

// ---------- Element dispatch ----------

function drawWeekdayElement(el, now) {
  const style = el.weekdayStyle || 'kanji';
  const s = Math.max(1, Math.floor(el.h / 8));   // base glyph height 8

  if (style === 'kanji') {
    const kanjiScale = Math.max(1, Math.floor(el.h / 16));
    const dow = now.getDay();
    drawKanjiBitmap(el.x, el.y, WEEKDAY_KANJI[dow], kanjiScale);
  } else {
    const DAYS = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    const label = DAYS[now.getDay()];
    const charW = 6 * s;
    let xx = el.x;
    for (const ch of label) {
      drawGLCDFontChar(xx, el.y, ch.charCodeAt(0), s);
      xx += charW;
    }
  }
}
function drawWeatherElement(el) {
  const s = Math.max(1, Math.floor(el.h / 16));
  // Placeholder weather until we wire real data into the browser
  const weatherIndex = 1;   // 1 = cloud, matches KWE_CLOUD
  drawKanjiBitmap(el.x, el.y, WEATHER_KANJI[weatherIndex], s);
}

function drawElement(el) {
  const now = new Date();
  switch (el.type) {
    case 'time':     drawTimeElement(el, now);    break;
    case 'seconds':  drawSecondsElement(el, now); break;
    case 'date':     drawDateElement(el, now);    break;
    case 'weekday':  drawWeekdayElement(el, now); break;
    case 'weather':  drawWeatherElement(el);      break;
    case 'temp':     drawTempElement(el);         break;
    case 'text':     drawTextElement(el);         break;
    case 'bar':      drawBarElement(el);         break;
    case 'background': drawBackgroundElement(el); break;
    default:         break;
  }
}

function drawBarElement(el) {
  const now = new Date();
  let value = 0;

  switch (el.source) {
    case 'time.hourProgress':
      value = (now.getMinutes() * 60 + now.getSeconds()) / 3600;
      break;
    case 'time.dayProgress':
      value = (now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds()) / 86400;
      break;
    case 'weather.humidity':
      value = 0.65;   // placeholder until real weather is used
      break;
    case 'battery.percent':
      value = 0.73;
      break;
    default:
      value = 0.5;
  }

  if (value < 0) value = 0;
  if (value > 1) value = 1;

  const vertical = (el.rotation === 90 || el.rotation === 270);
  const style = el.barStyle || 'solid';

  // Outline (if enabled) is drawn first, underneath the fill
  if (el.barOutline) {
    ctx.save();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1;
    ctx.strokeRect(
      el.x * SCALE + 0.5,
      el.y * SCALE + 0.5,
      el.w * SCALE - 1,
      el.h * SCALE - 1
    );
    ctx.restore();
  }

  // For outline-only style, use the full-extent box for drawing the fill
  // For other styles, inset by 1px so the outline doesn't get overdrawn
  const inset = el.barOutline ? 1 : 0;
  const bx = el.x + inset;
  const by = el.y + inset;
  const bw = el.w - inset * 2;
  const bh = el.h - inset * 2;

  if (bw <= 0 || bh <= 0) return;

  if (style === 'solid') {
    if (vertical) {
      const fillH = Math.floor(bh * value);
      if (fillH > 0) fillRectPx(bx, by + bh - fillH, bw, fillH);
    } else {
      const fillW = Math.floor(bw * value);
      if (fillW > 0) fillRectPx(bx, by, fillW, bh);
    }
  } else if (style === 'segmented') {
  const segCount = Math.max(2, el.segments || 10);
  const gap = 1;
  const totalGaps = (segCount - 1) * gap;
  const litCount = Math.round(segCount * value);

  if (vertical) {
    const segH = Math.floor((bh - totalGaps) / segCount);
    if (segH < 1) return;
    for (let i = 0; i < segCount; i++) {
      const segY = by + bh - (i + 1) * segH - i * gap;
      if (i < litCount) fillRectPx(bx, segY, bw, segH);
    }
  } else {
    const segW = Math.floor((bw - totalGaps) / segCount);
    if (segW < 1) return;
    for (let i = 0; i < segCount; i++) {
      const segX = bx + i * (segW + gap);
      if (i < litCount) fillRectPx(segX, by, segW, bh);
    }
  }
  } else if (style === 'dotted') {
    if (vertical) {
      const fillH = Math.floor(bh * value);
      for (let py = by + bh - fillH; py < by + bh; py++) {
        for (let px = bx; px < bx + bw; px++) {
          if (((px + py) & 1) === 0) {
            fillRectPx(px, py, 1, 1);
          }
        }
      }
    } else {
      const fillW = Math.floor(bw * value);
      for (let py = by; py < by + bh; py++) {
        for (let px = bx; px < bx + fillW; px++) {
          if (((px + py) & 1) === 0) {
            fillRectPx(px, py, 1, 1);
          }
        }
      }
    }
  }
}

function drawTimeElement(el, now) {
  const hh = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  const str = hh + mm;
  const rot = el.rotation || 0;
  const vertical = (rot === 90 || rot === 270);
  const s = scaleFromHeight(el.h, 8);

  if (el.style === '7seg') {
    if (vertical) {
      const digitW = Math.floor((el.w - 3) / 4);
      const h = el.h;
      const thick = Math.max(1, Math.round(Math.min(digitW, h) / 6));
      const digits = str.split('').map(Number);
      for (let i = 0; i < 4; i++) {
        draw7SegDigit(el.x + i * (digitW + 1), el.y, digitW, h, thick, digits[i]);
      }
    } else {
      const rowH = Math.floor(el.h / 4);
      const thick = Math.max(1, Math.round(rowH / 6));
      const digits = str.split('').map(Number);
      let yy = el.y;
      for (let i = 0; i < 4; i++) {
        draw7SegDigit(el.x, yy, el.w, rowH - 2, thick, digits[i]);
        yy += rowH;
      }
    }
  } else if (el.style === 'text') {
    if (vertical) {
      let yy = el.y;
      for (const ch of str) {
        drawGLCDFontChar(el.x, yy, ch.charCodeAt(0), s);
        yy += 8 * s;
      }
    } else {
      let xx = el.x;
      for (const ch of str) {
        drawGLCDFontChar(xx, el.y, ch.charCodeAt(0), s);
        xx += 6 * s;
      }
    }
  } else {
    // microhex
    const glyphW = (MHEX_WIDTH + 1) * s;
    const glyphH = (MHEX_HEIGHT + 1) * s;
    if (vertical) {
      let yy = el.y;
      for (const c of str.split('').map(Number)) {
        drawMicroHexDigit(el.x, yy, c, s);
        yy += glyphH;
      }
    } else {
      let xx = el.x;
      for (const c of str.split('').map(Number)) {
        drawMicroHexDigit(xx, el.y, c, s);
        xx += glyphW;
      }
    }
  }
}

function drawSecondsElement(el, now) {
  const ss = String(now.getSeconds()).padStart(2, '0');
  const rot = el.rotation || 0;
  const vertical = (rot === 90 || rot === 270);
  const s = scaleFromHeight(el.h, 8);

  if (el.style === '7seg') {
    if (vertical) {
      const digitH = Math.floor((el.h - 1) / 2);
      const w = el.w;
      const thick = Math.max(1, Math.round(Math.min(w, digitH) / 6));
      draw7SegDigit(el.x, el.y, w, digitH, thick, Number(ss[0]));
      draw7SegDigit(el.x, el.y + digitH + 1, w, digitH, thick, Number(ss[1]));
    } else {
      const digitW = Math.floor((el.w - 2) / 2);
      const h = el.h;
      const thick = Math.max(1, Math.round(Math.min(digitW, h) / 6));
      const y = el.y + Math.floor((el.h - h) / 2);
      draw7SegDigit(el.x, y, digitW, h, thick, Number(ss[0]));
      draw7SegDigit(el.x + digitW + 2, y, digitW, h, thick, Number(ss[1]));
    }
  } else if (el.style === 'text') {
    if (vertical) {
      let yy = el.y;
      for (const ch of ss) {
        drawGLCDFontChar(el.x, yy, ch.charCodeAt(0), s);
        yy += 8 * s;
      }
    } else {
      let xx = el.x;
      for (const ch of ss) {
        drawGLCDFontChar(xx, el.y, ch.charCodeAt(0), s);
        xx += 6 * s;
      }
    }
  } else {
    const glyphW = (MHEX_WIDTH + 1) * s;
    const glyphH = (MHEX_HEIGHT + 1) * s;
    if (vertical) {
      let yy = el.y;
      for (const c of ss.split('').map(Number)) {
        drawMicroHexDigit(el.x, yy, c, s);
        yy += glyphH;
      }
    } else {
      let xx = el.x;
      for (const c of ss.split('').map(Number)) {
        drawMicroHexDigit(xx, el.y, c, s);
        xx += glyphW;
      }
    }
  }
}
function drawDateElement(el, now) {
  const rot = el.rotation || 0;
  const mm = String(now.getMonth() + 1).padStart(2, '0');
  const dd = String(now.getDate()).padStart(2, '0');
  const s = scaleFromHeight(el.h, 8);

  let str = '';
  switch (el.format || 'MMDD') {
    case 'DDMM': str = dd + mm; break;
    case 'MM':   str = mm;      break;
    case 'DD':   str = dd;      break;
    case 'MMDD':
    default:     str = mm + dd; break;
  }

  const vertical = (rot === 90 || rot === 270);

  if (el.style === 'text') {
    if (vertical) {
      let yy = el.y;
      for (const ch of str) {
        drawGLCDFontChar(el.x, yy, ch.charCodeAt(0), s);
        yy += 8 * s;
      }
    } else {
      let xx = el.x;
      for (const ch of str) {
        drawGLCDFontChar(xx, el.y, ch.charCodeAt(0), s);
        xx += 6 * s;
      }
    }
    return;
  }

  // microhex
  const digits = str.split('').map(Number);
  const glyphW = (MHEX_WIDTH + 1) * s;
  const glyphH = (MHEX_HEIGHT + 1) * s;
  if (vertical) {
    let yy = el.y;
    for (const c of digits) {
      drawMicroHexDigit(el.x, yy, c, s);
      yy += glyphH;
    }
  } else {
    let xx = el.x;
    for (const c of digits) {
      drawMicroHexDigit(xx, el.y, c, s);
      xx += glyphW;
    }
  }
}

function drawTempElement(el) {
  const rot = el.rotation || 0;
  const temp = 21;
  const str = String(temp);
  const s = scaleFromHeight(el.h, 8);
  const vertical = (rot === 90 || rot === 270);

  if (el.style === 'text') {
    if (vertical) {
      let yy = el.y;
      for (const ch of str) {
        drawGLCDFontChar(el.x, yy, ch.charCodeAt(0), s);
        yy += 8 * s;
      }
    } else {
      let xx = el.x;
      for (const ch of str) {
        drawGLCDFontChar(xx, el.y, ch.charCodeAt(0), s);
        xx += 6 * s;
      }
    }
    return;
  }

  const digits = str.split('').map(Number);
  const glyphW = (MHEX_WIDTH + 1) * s;
  const glyphH = (MHEX_HEIGHT + 1) * s;
  if (vertical) {
    let yy = el.y;
    for (const c of digits) {
      drawMicroHexDigit(el.x, yy, c, s);
      yy += glyphH;
    }
  } else {
    let xx = el.x;
    for (const c of digits) {
      drawMicroHexDigit(xx, el.y, c, s);
      xx += glyphW;
    }
  }
}
 
function drawPlaceholder(x, y, w, h, label) {
  ctx.save();
  ctx.strokeStyle = '#f80';
  ctx.setLineDash([2, 2]);
  ctx.strokeRect(x * SCALE + 0.5, y * SCALE + 0.5, w * SCALE, h * SCALE);
  ctx.fillStyle = '#f80';
  ctx.font = `${Math.floor(h * SCALE * 0.5)}px system-ui`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, (x + w / 2) * SCALE, (y + h / 2) * SCALE);
  ctx.restore();
}

// ============================================================
// Main render dispatcher
// ============================================================
function render() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (currentMode === 'anim') {
    renderAnim();
    updateAnimStatus();
  } else {
    renderFace();
    updateFaceStatus();
  }
}

function renderAnim() {
  ctx.fillStyle = '#ffffff';
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      if (pixels[idx(x, y)]) ctx.fillRect(x * SCALE, y * SCALE, SCALE, SCALE);
    }
  }
  // Preview overlay (uncommitted shape) rendered last so it sits on top
  if (shapeActive) {
    ctx.fillStyle = '#ffffff';
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        if (previewPixels[idx(x, y)]) {
          ctx.fillRect(x * SCALE, y * SCALE, SCALE, SCALE);
        }
      }
    }
  }
  drawGrid();
  drawAdSafeArea();
}

function drawAdSafeArea() {
  // No safe-area strip anymore — the whole 32×128 canvas is sent.
  // (Kept as a function so callers stay unchanged; can become a no-op
  // or repurposed later.)
}

function updateAnimStatus() {
  let count = 0;
  for (let i = 0; i < pixels.length; i++) if (pixels[i]) count++;
  document.getElementById('status').textContent =
    `${W}×${H} • ${count} px on • zoom ${SCALE}×`;
}

function updateFaceStatus() {
  document.getElementById('status').textContent =
    `${W}×${H} • ${elements.length} element${elements.length===1?'':'s'} • face mode`;
}

// ============================================================
// Placement helpers
// ============================================================
function overlapsAny(x, y, w, h) {
  for (const el of elements) {
    if (x < el.x + el.w && x + w > el.x &&
        y < el.y + el.h && y + h > el.y) {
      return true;
    }
  }
  return false;
}

function findFreeSpot(w, h) {
  const step = 4;
  for (let y = 0; y <= H - h; y += step) {
    for (let x = 0; x <= W - w; x += step) {
      if (!overlapsAny(x, y, w, h)) return { x, y };
    }
  }
  return {
    x: Math.max(0, Math.floor((W - w) / 2)),
    y: Math.max(0, Math.floor((H - h) / 2)),
  };
}

function addElement(type) {
  const defaults = {
    time: { w: 32, h: 56, style: '7seg', thick: 3, scale: 1 },
    seconds: { w: 20, h: 10, style: '7seg' },  
    date:    { w: 26, h: 16, style: 'microhex', scale: 2, format: 'MMDD' },
    weekday: { w: 16, h: 16 },
    weather: { w: 16, h: 16 },
    temp:    { w: 26, h: 16, style: 'microhex', scale: 2 },
    bar: { w: 4, h: 48, source: 'time.hourProgress', barStyle: 'solid', segments: 10, barOutline: true,},
    text: { w: 32, h: 16, content: 'Hello', scale: 1 },
    background: { w: 32, h: 128 },
  };
  const def = defaults[type];
  if (!def) return;

    const { w, h, ...props } = def;

  // Background: only one allowed, always at (0,0), always first in the array
  if (type === 'background') {
    // Remove any existing background element
    const existingIdx = elements.findIndex(e => e.type === 'background');
    if (existingIdx >= 0) elements.splice(existingIdx, 1);

    const el = { id: nextId++, type, x: 0, y: 0, w, h, ...props };
    elements.unshift(el);   // insert at front so it draws first
    selectedId = el.id;
    rebuildProps();
    render();
    return;
  }

  const spot = findFreeSpot(w, h);
  const el = {
    id: nextId++,
    type,
    x: spot.x,
    y: spot.y,
    w,
    h,
    ...props,
  };
  elements.push(el);
  selectedId = el.id;
  rebuildProps();
  render();
}

        const maxLoops = Math.max(1, Math.floor(30000 / (frames.length * msVal)));
        loopCount = Math.min(v, maxLoops);
        if (loopCount !== v) loops.value = loopCount;
        refreshSummary();
      };
    }
  }
}

// ============================================================
// Animation drawing input handlers
// ============================================================
let mouseDown = false;
let paintValue = 1;
let lastCell = null;

function cellFromEvent(e) {
  const r = canvas.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) / SCALE);
  const y = Math.floor((e.clientY - r.top)  / SCALE);
  if (x < 0 || x >= W || y < 0 || y >= H) return null;
  return { x, y };
}

function paintCell(x, y, val) {
  if (x < 0 || x >= W || y < 0 || y >= H) return;
  const i = idx(x, y);
  if (pixels[i] === val) return;
  pixels[i] = val;
  ctx.fillStyle = val ? '#ffffff' : '#000';
  ctx.fillRect(x * SCALE, y * SCALE, SCALE, SCALE);
}

function paintBrush(cx, cy, val) {
  const half = Math.floor(brushSize / 2);
  for (let dy = -half; dy < brushSize - half; dy++) {
    for (let dx = -half; dx < brushSize - half; dx++) {
      paintCell(cx + dx, cy + dy, val);
    }
  }
  updateAnimStatus();
}

// Keep the old `paint` name for backwards compatibility with lineTo
function paint(cell) {
  if (!cell) return;
  paintBrush(cell.x, cell.y, paintValue);
}

function plotBrushToBuffer(buf, cx, cy, val) {
  const half = Math.floor(brushSize / 2);
  for (let dy = -half; dy < brushSize - half; dy++) {
    for (let dx = -half; dx < brushSize - half; dx++) {
      const x = cx + dx;
      const y = cy + dy;
      if (x < 0 || x >= W || y < 0 || y >= H) continue;
      buf[idx(x, y)] = val;
    }
  }
}

function drawLineToBuffer(buf, x0, y0, x1, y1, val) {
  const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1;
  const dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  while (true) {
    plotBrushToBuffer(buf, x0, y0, val);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}

 function drawRectToBuffer(buf, x0, y0, x1, y1, val, filled) {
  if (x0 > x1) { const t = x0; x0 = x1; x1 = t; }
  if (y0 > y1) { const t = y0; y0 = y1; y1 = t; }

  if (filled) {
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        plotBrushToBuffer(buf, x, y, val);
      }
    }
  } else {
    // Outline: top and bottom edges, then left and right edges
    for (let x = x0; x <= x1; x++) {
      plotBrushToBuffer(buf, x, y0, val);
      plotBrushToBuffer(buf, x, y1, val);
    }
    for (let y = y0; y <= y1; y++) {
      plotBrushToBuffer(buf, x0, y, val);
      plotBrushToBuffer(buf, x1, y, val);
    }
  }
}

function pushUndo() {
  undoStack.push(new Uint8Array(pixels));
  if (undoStack.length > 50) undoStack.shift();
}

canvas.addEventListener('pointerdown', e => {
  if (!e.isPrimary) return;
  if (currentMode !== 'anim') return;
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);
  mouseDown = true;
  pushUndo();
  const cell = cellFromEvent(e);
  if (!cell) return;

  if (currentTool === 'eraser') paintValue = 0;
  else                          paintValue = 1;

  if (currentTool === 'pencil' || currentTool === 'eraser') {
    lastCell = null;
    paintBrush(cell.x, cell.y, paintValue);
  } else if (currentTool === 'line') {
    shapeStart = { x: cell.x, y: cell.y };
    shapeEnd   = { x: cell.x, y: cell.y };
    shapeActive = true;
    previewPixels.fill(0);
    render();
  } else if (currentTool === 'rect' || currentTool === 'rectFill') {
    shapeStart = { x: cell.x, y: cell.y };
    shapeEnd   = { x: cell.x, y: cell.y };
    shapeActive = true;
    previewPixels.fill(0);
    render();
  }
});

canvas.addEventListener('pointermove', e => {
  if (!e.isPrimary) return;
  if (currentMode !== 'anim' || !mouseDown) return;
  const cell = cellFromEvent(e);
  if (!cell) return;

  if (currentTool === 'pencil' || currentTool === 'eraser') {
    if (lastCell && (cell.x !== lastCell.x || cell.y !== lastCell.y)) {
      lineTo(lastCell, cell);
    } else {
      paint(cell);
    }
    lastCell = cell;
  } else if (currentTool === 'line' && shapeActive) {
    shapeEnd = { x: cell.x, y: cell.y };
    previewPixels.fill(0);
    drawLineToBuffer(previewPixels, shapeStart.x, shapeStart.y, shapeEnd.x, shapeEnd.y, 1);
    render();
  } else if ((currentTool === 'rect' || currentTool === 'rectFill') && shapeActive) {
    shapeEnd = { x: cell.x, y: cell.y };
    previewPixels.fill(0);
    drawRectToBuffer(
      previewPixels,
      shapeStart.x, shapeStart.y,
      shapeEnd.x, shapeEnd.y,
      1,
      currentTool === 'rectFill'
    );
    render();
  }
});

canvas.addEventListener('pointerup', e => {
  if (!e.isPrimary) return;
  if (currentMode !== 'anim') { mouseDown = false; return; }
  if (!mouseDown) return;
  mouseDown = false;
  lastCell = null;

  if ((currentTool === 'line' || currentTool === 'rect' || currentTool === 'rectFill') && shapeActive) {
    for (let i = 0; i < previewPixels.length; i++) {
      if (previewPixels[i]) pixels[i] = 1;
    }
    previewPixels.fill(0);
    shapeActive = false;
    shapeStart = null;
    shapeEnd = null;
    render();
    renderTimeline();
  }
});

canvas.addEventListener('pointerleave', e => {
  if (!e.isPrimary) return;
  if (!mouseDown) return;
  mouseDown = false;
  lastCell = null;
  if (shapeActive) {
    previewPixels.fill(0);
    shapeActive = false;
    shapeStart = null;
    shapeEnd = null;
    render();
  }
});

function lineTo(a, b) {
  let x0 = a.x, y0 = a.y;
  const x1 = b.x, y1 = b.y;
  const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1;
  const dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  while (true) {
    paint({ x: x0, y: y0 });
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}

// ============================================================
// FACE MODE INTERACTION
// ============================================================
let dragState = null;

function elementAtPoint(px, py) {
  for (let i = elements.length - 1; i >= 0; i--) {
    const el = elements[i];
    if (px >= el.x && px < el.x + el.w &&
        py >= el.y && py < el.y + el.h) {
      return el;
    }
  }
  return null;
}

function canvasToPixel(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  return {
    x: Math.floor((clientX - r.left) / SCALE),
    y: Math.floor((clientY - r.top)  / SCALE),
  };
}

function handleAtPoint(clientX, clientY) {
  if (selectedId === null) return null;
  const el = elements.find(e => e.id === selectedId);
  if (!el) return null;

  const r = canvas.getBoundingClientRect();
  const sx = clientX - r.left;
  const sy = clientY - r.top;
  const half = HANDLE_SIZE / 2 + 2;

  const corners = {
    TL: [el.x * SCALE,            el.y * SCALE],
    TR: [(el.x + el.w) * SCALE,   el.y * SCALE],
    BL: [el.x * SCALE,            (el.y + el.h) * SCALE],
    BR: [(el.x + el.w) * SCALE,   (el.y + el.h) * SCALE],
  };
  for (const [name, [cx, cy]] of Object.entries(corners)) {
    if (Math.abs(sx - cx) <= half && Math.abs(sy - cy) <= half) return name;
  }
  return null;
}

canvas.addEventListener('pointerdown', e => {
  if (!e.isPrimary) return;
  if (currentMode !== 'face') return;
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);

  const handle = handleAtPoint(e.clientX, e.clientY);
  if (handle) {
    const el = elements.find(el => el.id === selectedId);
    dragState = {
      mode: 'resize',
      handle,
      el,
      startX: el.x,
      startY: el.y,
      startW: el.w,
      startH: el.h,
      startPx: canvasToPixel(e.clientX, e.clientY),
    };
    return;
  }

  const p = canvasToPixel(e.clientX, e.clientY);
  const hit = elementAtPoint(p.x, p.y);
  if (hit) {
    selectedId = hit.id;
    dragState = {
      mode: 'move',
      el: hit,
      offsetX: p.x - hit.x,
      offsetY: p.y - hit.y,
    };
  } else {
    selectedId = null;
    dragState = null;
  }
  rebuildProps();
  render();
});

canvas.addEventListener('pointermove', e => {
  if (!e.isPrimary) return;
  if (currentMode !== 'face' || !dragState) return;
  const p = canvasToPixel(e.clientX, e.clientY);

  if (dragState.mode === 'move') {
    const el = dragState.el;
    let nx = p.x - dragState.offsetX;
    let ny = p.y - dragState.offsetY;
    nx = Math.max(0, Math.min(W - el.w, nx));
    ny = Math.max(0, Math.min(H - el.h, ny));
    el.x = nx;
    el.y = ny;
  } else if (dragState.mode === 'resize') {
    const el = dragState.el;
    const start = dragState.startPx;
    const dx = p.x - start.x;
    const dy = p.y - start.y;

    let newX = dragState.startX;
    let newY = dragState.startY;
    let newW = dragState.startW;
    let newH = dragState.startH;

    switch (dragState.handle) {
      case 'TL':
        newX = dragState.startX + dx;
        newY = dragState.startY + dy;
        newW = dragState.startW - dx;
        newH = dragState.startH - dy;
        break;
      case 'TR':
        newY = dragState.startY + dy;
        newW = dragState.startW + dx;
        newH = dragState.startH - dy;
        break;
      case 'BL':
        newX = dragState.startX + dx;
        newW = dragState.startW - dx;
        newH = dragState.startH + dy;
        break;
      case 'BR':
        newW = dragState.startW + dx;
        newH = dragState.startH + dy;
        break;
    }

    const MIN = 4;

    // Force square for icon element types
    const squareTypes = new Set(['weekday', 'weather']);
    if (squareTypes.has(el.type)) {
      const size = Math.max(MIN, Math.round((newW + newH) / 2));
      newW = size;
      newH = size;
      if (dragState.handle === 'TL' || dragState.handle === 'BL') {
        newX = dragState.startX + dragState.startW - size;
      }
      if (dragState.handle === 'TL' || dragState.handle === 'TR') {
        newY = dragState.startY + dragState.startH - size;
      }
    }

    if (newW < MIN) newW = MIN;
    if (newH < MIN) newH = MIN;
    if (newX < 0) newX = 0;
    if (newY < 0) newY = 0;
    if (newX + newW > W) newW = W - newX;
    if (newY + newH > H) newH = H - newY;

    el.x = newX;
    el.y = newY;
    el.w = newW;
    el.h = newH;
  }

  render();
});

canvas.addEventListener('pointerup', e => {
  if (!e.isPrimary) return;
  if (currentMode !== 'face') return;
  if (dragState) {
    dragState = null;
    rebuildProps();
  }
});

canvas.addEventListener('pointerleave', e => {
  if (!e.isPrimary) return;
  if (currentMode !== 'face') return;
  if (dragState) {
    dragState = null;
    rebuildProps();
  }
});

// BLE
// ============================================================
const SERVICE = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const RX_CHAR = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';

let bleDevice = null;
let bleServer = null;
let bleRxChar = null;
let bleConnected = false;

const btnConnect = document.getElementById('btnConnect');
const btnSend    = document.getElementById('btnSend');
const connStatus = document.getElementById('connStatus');

function setConnUI(state, msg) {
  connStatus.classList.remove('connected', 'error');
  connStatus.textContent = msg;

  if (state === 'disconnected') {
    btnConnect.textContent = 'Connect to Watch';
    btnConnect.disabled = false;
    btnSend.disabled = true;
    bleConnected = false;
  } else if (state === 'connecting') {
    btnConnect.textContent = 'Connecting…';
    btnConnect.disabled = true;
    btnSend.disabled = true;
    bleConnected = false;
  } else if (state === 'connected') {
    btnConnect.textContent = 'Disconnect';
    btnConnect.disabled = false;
    btnSend.disabled = false;
    bleConnected = true;
    connStatus.classList.add('connected');
  } else if (state === 'error') {
    btnConnect.textContent = 'Connect to Watch';
    btnConnect.disabled = false;
    btnSend.disabled = true;
    bleConnected = false;
    connStatus.classList.add('error');
  }
}

async function doConnect() {
  if (!navigator.bluetooth) {
    setConnUI('error', 'Web Bluetooth not supported in this browser');
    return;
  }
  try {
    setConnUI('connecting', 'Requesting device…');
    bleDevice = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE] }],
      optionalServices: [SERVICE]
    });

    bleDevice.addEventListener('gattserverdisconnected', () => {
      bleServer = null;
      bleRxChar = null;
      setConnUI('disconnected', 'Disconnected');
    });

    setConnUI('connecting', 'Connecting…');
    bleServer = await bleDevice.gatt.connect();

    setConnUI('connecting', 'Finding service…');
    const service = await bleServer.getPrimaryService(SERVICE);

    setConnUI('connecting', 'Finding characteristic…');
    bleRxChar = await service.getCharacteristic(RX_CHAR);

    setConnUI('connected', `Connected: ${bleDevice.name || 'watch'}`);
  } catch (e) {
    console.error(e);
    setConnUI('error', `Error: ${e.message}`);
  }
}

function doDisconnect() {
  try {
    if (bleDevice && bleDevice.gatt.connected) bleDevice.gatt.disconnect();
  } catch (_) {}
  setConnUI('disconnected', 'Disconnected');
}

btnConnect.onclick = () => {
  if (bleConnected) doDisconnect();
  else doConnect();
};

// ============================================================
// Build outgoing JSON
// ============================================================
// Ad region constants — must match firmware
const AD_W         = 32;
const AD_H         = 128;
const AD_OFFSET_Y  = 0;   // top strip reserved for firmware HHMM
const AD_MAX_FRAMES = 80;

function buildAnimJson() {
  const frameCount = frames.length;
  if (frameCount > AD_MAX_FRAMES) {
    throw new Error(`Too many frames: ${frameCount} (max ${AD_MAX_FRAMES})`);
  }

  const frameMs = frames[0].durationMs || 125;

  const totalMs = frameCount * frameMs * loopCount;
  if (totalMs > 30000) {
    throw new Error(`Total play time ${(totalMs/1000).toFixed(1)}s exceeds 30s cap`);
  }

  const bytesPerRow = Math.ceil(AD_W / 8);        // 4
  const bytesPerFrame = bytesPerRow * AD_H;       // 384
  const all = new Uint8Array(bytesPerFrame * frameCount);

  for (let f = 0; f < frameCount; f++) {
    const src = frames[f].pixels;
    const base = f * bytesPerFrame;
    // Crop rows AD_OFFSET_Y .. AD_OFFSET_Y + AD_H - 1 from the 32x128 source
    for (let y = 0; y < AD_H; y++) {
      const srcY = y + AD_OFFSET_Y;
      for (let x = 0; x < AD_W; x++) {
        if (src[srcY * W + x]) {
          const byteIndex = base + y * bytesPerRow + (x >> 3);
          const bitIndex  = x & 7;
          all[byteIndex] |= (1 << bitIndex);
        }
      }
    }
  }

  let binary = '';
  const CHUNK = 0x8000;
  for (let i = 0; i < all.length; i += CHUNK) {
    binary += String.fromCharCode.apply(
      null, all.subarray(i, Math.min(i + CHUNK, all.length))
    );
  }
  const b64 = btoa(binary);

    return JSON.stringify({
    kind: 'animation',
    v: 1,
    name: 'untitled',
    w: AD_W,
    h: AD_H,
    offsetY: AD_OFFSET_Y,
    frameMs: frameMs,
    frameCount: frameCount,
    loopCount: loopCount,
    format: 'bitpacked-row-lsb',
    data: b64
  });
}

function buildFaceConfigJson() {
  const outElements = elements.map(e => {
    const copy = { ...e };
    if (e.type === 'weekday') {
      copy.style = (e.weekdayStyle === 'english') ? 'text' : '7seg';
    }
    return copy;
  });
  return JSON.stringify({
    kind: 'face',
    v: 1,
    name: 'untitled',
    effects: effects,
    elements: outElements
  });
}

function buildPayload() {
  return currentMode === 'anim' ? buildAnimJson() : buildFaceConfigJson();
}

// ============================================================
// Send to watch
// ============================================================
const CHUNK_SIZE = 180;

async function sendToWatch() {
  if (!bleConnected || !bleRxChar) throw new Error('Not connected');

  const json = buildPayload();
  const payload = new TextEncoder().encode(json);

  if (payload.length > 0xFFFF) throw new Error('Payload too large (>64 KB)');

  const frame = new Uint8Array(2 + payload.length);
  frame[0] = payload.length & 0xFF;
  frame[1] = (payload.length >> 8) & 0xFF;
  frame.set(payload, 2);

  let sent = 0;
  while (sent < frame.length) {
    const slice = frame.slice(sent, sent + CHUNK_SIZE);
    if (bleRxChar.writeValueWithoutResponse) {
      await bleRxChar.writeValueWithoutResponse(slice);
    } else {
      await bleRxChar.writeValue(slice);
    }
    sent += slice.length;
    connStatus.textContent = `Sending… ${sent}/${frame.length}`;
  }

  connStatus.textContent = `Sent ${payload.length} bytes (${frame.length} on wire)`;
}

btnSend.onclick = async () => {
  try {
    btnSend.disabled = true;
    connStatus.classList.remove('error');
    await sendToWatch();
    connStatus.classList.add('connected');
  } catch (e) {
    console.error(e);
    setConnUI('connected', `Send error: ${e.message}`);
    connStatus.classList.remove('connected');
    connStatus.classList.add('error');
  } finally {
    btnSend.disabled = false;
  }
};
