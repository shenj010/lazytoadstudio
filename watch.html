<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Watch Designer</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif;
    background: #1a1a1a; color: #e0e0e0;
    margin: 0; padding: 0;
    display: flex; flex-direction: column;
    min-height: 100vh;
  }

  header {
    display: flex; align-items: center; gap: 20px;
    padding: 12px 20px;
    border-bottom: 1px solid #333;
    background: #222;
  }
  .tabs { display: flex; gap: 4px; }
  .tabs button {
    width: auto; margin: 0;
    padding: 8px 18px;
    background: transparent; color: #888;
    border: 1px solid #444; border-radius: 4px;
    cursor: pointer;
  }
  .tabs button.active {
    background: #3a3a3a; color: #fff; border-color: #666;
  }
  .conn {
    margin-left: auto; display: flex; align-items: center; gap: 10px;
  }
  .conn button {
    width: auto; margin: 0;
    padding: 8px 14px;
  }
  #connStatus { font-size: 12px; color: #888; }
  #connStatus.connected { color: #6c6; }
  #connStatus.error     { color: #c66; }

  main {
    flex: 1;
    display: flex; gap: 20px;
    padding: 20px;
    align-items: flex-start;
  }

  aside { min-width: 220px; max-width: 260px; }

  #canvasWrap {
    background: #000; padding: 8px; border-radius: 6px;
    display: inline-block;
  }
  canvas {
    image-rendering: pixelated; display: block;
    cursor: crosshair;
  }
  canvas.face-mode { cursor: default; }

  button {
    display: block; width: 100%; margin: 6px 0;
    padding: 8px; font-size: 14px;
    background: #333; color: #e0e0e0;
    border: 1px solid #555; border-radius: 4px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: #444; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  h2 {
    margin-top: 0; font-size: 14px;
    text-transform: uppercase; letter-spacing: 1px;
    color: #888;
  }
  h2:not(:first-child) { margin-top: 20px; }

  #status { font-size: 12px; color: #888; margin-top: 12px; }
  #propsEmpty { font-size: 12px; color: #666; }

  .checkbox-row {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 0; font-size: 13px; color: #ccc;
    cursor: pointer;
  }
  .checkbox-row input { margin: 0; cursor: pointer; }

  .prop-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px 0; font-size: 13px;
    border-bottom: 1px solid #2a2a2a;
  }
  .prop-row label { color: #888; }
  .prop-row span  { color: #e0e0e0; font-variant-numeric: tabular-nums; }

  .prop-row input,
  .prop-row select {
    background: #222; color: #e0e0e0;
    border: 1px solid #444; border-radius: 3px;
    padding: 2px 6px; font-size: 13px;
    width: 70px; text-align: right;
  }
  .prop-row select { width: 120px; text-align: left; }

</style>
<script src="glcdfont.js"></script>
</head>
<body>

<header>
  <div class="tabs">
    <button data-mode="face" class="active">Watch Face</button>
    <button data-mode="anim">Animation</button>
  </div>
  <div class="conn">
    <button id="btnConnect">Connect to Watch</button>
    <button id="btnSend" disabled>Send to Watch</button>
    <span id="connStatus">Not connected</span>
  </div>
</header>

<main>
  <aside id="palette">
    <h2>Palette</h2>
    <div id="paletteBody"></div>
  </aside>

  <section id="canvasWrap">
    <canvas id="c"></canvas>
  </section>

  <aside id="props">
    <h2>Properties</h2>
    <div id="propsBody"><div id="propsEmpty">Nothing selected</div></div>
    <div id="effectsBox" style="display:none">
      <h2>Face Effects</h2>
      <label class="checkbox-row">
        <input type="checkbox" id="fxScanline"> Scanline
      </label>
      <label class="checkbox-row">
        <input type="checkbox" id="fxGlitch"> Glitch
      </label>
      <label class="checkbox-row">
        <input type="checkbox" id="fxJitter"> Jitter
      </label>
      <label class="checkbox-row">
        <input type="checkbox" id="fxCorners" checked> Corner brackets
      </label>
      <label class="checkbox-row">
        <input type="checkbox" id="fxStatus"> Status bar
      </label>
      <label class="checkbox-row">
        <input type="checkbox" id="fxAd" checked> Ad override
      </label>
    </div>
    <div id="status">—</div>
  </aside>
</main>

<script>
// ============================================================
// Screen config
// ============================================================
const W = 32;
const H = 128;
const SCALE = 6;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width  = W * SCALE;
canvas.height = H * SCALE;

let currentMode = 'face';

// ============================================================
// ANIMATION STATE
// ============================================================
let pixels = new Uint8Array(W * H);
let undoStack = [];

function idx(x, y) { return y * W + x; }

// ============================================================
// FACE STATE
// ============================================================
let elements = [
  { id: 1, type: 'time',    style: '7seg',     x: 0,  y: 2,   w: 32, h: 56, thick: 3 },
  { id: 2, type: 'date',    style: 'microhex', format: 'MMDD', scale: 2, x: 0, y: 64, w: 26, h: 16 },
  { id: 3, type: 'weekday',                     x: 0,  y: 88,  w: 16, h: 16 },
  { id: 4, type: 'weather',                     x: 16, y: 88,  w: 16, h: 16 },
  { id: 5, type: 'temp',    style: 'microhex', scale: 2, x: 0, y: 108, w: 26, h: 16 },
];
let selectedId = null;
let nextId = 6;

let effects = {
  scanline: false,
  glitch: false,
  jitter: false,
  corners: true,
  status: false,
  ad: true,
};

let scanY = 0;

// ============================================================
// Fonts
// ============================================================
const MHEX_GLYPHS = [
  [0x3C,0x4A,0x52,0x62,0x42,0x3C],
  [0x00,0x22,0x7E,0x02,0x00,0x00],
  [0x26,0x4A,0x4A,0x4A,0x52,0x24],
  [0x24,0x42,0x4A,0x4A,0x4A,0x34],
  [0x18,0x28,0x48,0x7E,0x08,0x08],
  [0x72,0x52,0x52,0x52,0x52,0x5E],
  [0x3C,0x52,0x52,0x52,0x52,0x0C],
  [0x40,0x40,0x46,0x58,0x60,0x40],
  [0x2C,0x52,0x52,0x52,0x52,0x2C],
  [0x20,0x52,0x52,0x52,0x52,0x3C],
];
const MHEX_WIDTH = 6;
const MHEX_HEIGHT = 8;

const SEG_MAP = [
  0b0111111, 0b0000110, 0b1011011, 0b1001111, 0b1100110,
  0b1101101, 0b1111101, 0b0000111, 0b1111111, 0b1101111
];

// ============================================================
// Low-level pixel writes
// ============================================================
function fillRectPx(x, y, w, h) {
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(x * SCALE, y * SCALE, w * SCALE, h * SCALE);
}

function drawPixelPx(x, y) {
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(x * SCALE, y * SCALE, SCALE, SCALE);
}

// ============================================================
// 7-segment renderer
// ============================================================
function draw7SegDigit(x, y, w, h, thick, d) {
  if (d < 0 || d > 9) return;
  const mask = SEG_MAP[d];
  const midY = y + Math.floor(h / 2);

  let upperLen = Math.floor(h / 2) - thick - 1;
  if (upperLen < 0) upperLen = 0;
  const lowerLen = upperLen;

  const hSeg = (yy) => fillRectPx(x, yy, w, thick);
  const vSeg = (xx, yy, len) => { if (len > 0) fillRectPx(xx, yy, thick, len); };

  if (mask & (1 << 0)) hSeg(y);
  if (mask & (1 << 6)) hSeg(midY - Math.floor(thick / 2));
  if (mask & (1 << 3)) hSeg(y + h - thick);

  if (mask & (1 << 5)) vSeg(x, y + thick, upperLen);
  if (mask & (1 << 1)) vSeg(x + w - thick, y + thick, upperLen);
  if (mask & (1 << 4)) vSeg(x, midY + Math.floor(thick / 2), lowerLen);
  if (mask & (1 << 2)) vSeg(x + w - thick, midY + Math.floor(thick / 2), lowerLen);
}

// ============================================================
// Bitmap glyph renderer
// ============================================================
function drawMicroHexDigit(x, y, digit, scale) {
  if (digit < 0 || digit > 9) return;
  const cols = MHEX_GLYPHS[digit];
  drawGlyphColumns(x, y, cols, MHEX_WIDTH, MHEX_HEIGHT, scale);
}

function drawGlyphColumns(x, y, cols, w, h, scale) {
  for (let cx = 0; cx < w; cx++) {
    const col = cols[cx];
    let flipped = 0;
    for (let b = 0; b < h; b++) {
      if (col & (1 << b)) flipped |= (1 << (h - 1 - b));
    }
    for (let row = 0; row < h; row++) {
      if (flipped & (1 << row)) {
        fillRectPx(x + cx * scale, y + row * scale, scale, scale);
      }
    }
  }
}

 function drawGLCDFontChar(x, y, code, scale) {
  if (code < 0 || code > 255) code = '?'.charCodeAt(0);
  const base = code * 5;
  for (let cx = 0; cx < 5; cx++) {
    const col = GLCDFONT[base + cx];
    for (let row = 0; row < 8; row++) {
      if (col & (1 << row)) {
        fillRectPx(x + cx * scale, y + row * scale, scale, scale);
      }
    }
  }
}

function drawTextElement(el) {
  const s = el.scale || 1;
  const rot = el.rotation || 0;
  const content = el.content || 'Hello';
  const charW = 6 * s;
  const charH = 8 * s;

  if (rot === 90 || rot === 270) {
    // Vertical layout: one char per row
    let yy = el.y;
    for (const ch of content) {
      drawGLCDFontChar(el.x, yy, ch.charCodeAt(0), s);
      yy += charH;
    }
  } else {
    // Horizontal layout (default and 180)
    let xx = el.x;
    for (const ch of content) {
      drawGLCDFontChar(xx, el.y, ch.charCodeAt(0), s);
      xx += charW;
    }
  }
}
// ============================================================
// FACE renderer
// ============================================================
function renderFace() {
  drawGrid();

  for (const el of elements) drawElement(el);

  if (selectedId !== null) {
    const el = elements.find(e => e.id === selectedId);
    if (el) drawSelectionOutline(el);
  }

  if (effects.scanline) drawScanline();
  if (effects.corners)  drawCornerBrackets();
  if (effects.status)   drawStatusBar();
}

const HANDLE_SIZE = 8;
const HANDLE_COLOR = '#3af';

function drawSelectionOutline(el) {
  const x = el.x * SCALE;
  const y = el.y * SCALE;
  const w = el.w * SCALE;
  const h = el.h * SCALE;

  ctx.save();
  ctx.strokeStyle = HANDLE_COLOR;
  ctx.lineWidth = 2;
  ctx.setLineDash([]);
  ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);

  const corners = [
    [x,     y    ],
    [x + w, y    ],
    [x,     y + h],
    [x + w, y + h],
  ];
  ctx.fillStyle = HANDLE_COLOR;
  for (const [cx, cy] of corners) {
    ctx.fillRect(
      cx - HANDLE_SIZE / 2,
      cy - HANDLE_SIZE / 2,
      HANDLE_SIZE,
      HANDLE_SIZE
    );
  }
  ctx.restore();
}

function drawGrid() {
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 8) {
    ctx.beginPath();
    ctx.moveTo(x * SCALE + 0.5, 0);
    ctx.lineTo(x * SCALE + 0.5, canvas.height);
    ctx.stroke();
  }
  for (let y = 0; y <= H; y += 8) {
    ctx.beginPath();
    ctx.moveTo(0, y * SCALE + 0.5);
    ctx.lineTo(canvas.width, y * SCALE + 0.5);
    ctx.stroke();
  }
}

// ---------- Effects ----------

function drawScanline() {
  fillRectPx(0, scanY, W, 1);
}

function drawCornerBrackets() {
  fillRectPx(0, 0, 8, 1);
  fillRectPx(0, 0, 1, 6);
  fillRectPx(W - 8, 0, 8, 1);
  fillRectPx(W - 1, 0, 1, 6);
  fillRectPx(0, H - 1, 8, 1);
  fillRectPx(0, H - 6, 1, 6);
  fillRectPx(W - 8, H - 1, 8, 1);
  fillRectPx(W - 1, H - 6, 1, 6);
}

function drawStatusBar() {
  drawTextSmall(0, 0, 'BAT');
  for (let i = 0; i < 3; i++) {
    fillRectPx(20 + i * 4, 0, 2, 5);
  }
  drawTextSmall(0, 6, 'SIG');
  for (let i = 0; i < 2; i++) {
    fillRectPx(20 + i * 4, 6, 2, 5);
  }
}

function drawTextSmall(x, y, str) {
  ctx.save();
  ctx.fillStyle = '#ffffff';
  ctx.font = '5px monospace';
  ctx.textBaseline = 'top';
  ctx.fillText(str, x * SCALE, y * SCALE);
  ctx.restore();
}

// ---------- Element dispatch ----------

function drawWeekdayElement(el, now) {
  drawPlaceholder(el.x, el.y, el.w, el.h, 'WD');
}

function drawWeatherElement(el) {
  drawPlaceholder(el.x, el.y, el.w, el.h, 'WX');
}

function drawTempElement(el) {
  const s = el.scale || 1;
  const rot = el.rotation || 0;
  const temp = 21;
  const str = String(temp);
  const s = microhexScaleFor(el, str.length);

  if (el.style === 'text') {
    let xx = el.x;
    for (const ch of str) {
      drawGLCDFontChar(xx, el.y, ch.charCodeAt(0), s);
      xx += 6 * s;
    }
    return;
  }

  // microhex (default)
  const digits = str.split('').map(Number);
  const glyphW = (MHEX_WIDTH + 1) * s;
  const glyphH = (MHEX_HEIGHT + 1) * s;

  if (rot === 90 || rot === 270) {
    let yy = el.y;
    for (const c of digits) {
      drawMicroHexDigit(el.x, yy, c, s);
      yy += glyphH;
    }
  } else {
    let xx = el.x;
    for (const c of digits) {
      drawMicroHexDigit(xx, el.y, c, s);
      xx += glyphW;
    }
  }
}
  function drawElement(el) {
  const now = new Date();
  switch (el.type) {
    case 'time':     drawTimeElement(el, now);    break;
    case 'seconds':  drawSecondsElement(el, now); break;
    case 'date':     drawDateElement(el, now);    break;
    case 'weekday':  drawWeekdayElement(el, now); break;
    case 'weather':  drawWeatherElement(el);      break;
    case 'temp':     drawTempElement(el);         break;
    case 'text':     drawTextElement(el);         break;
    default:         break;
  }
}

function drawTimeElement(el, now) {
  const hh = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  const str = hh + mm;
  const s = el.scale || 1;
  const s = microhexScaleFor(el, str.length);

  if (el.style === '7seg') {
    const rowH = Math.floor(el.h / 4);
    const thick = Math.max(1, Math.round(rowH / 6));
    const digits = str.split('').map(Number);
    let yy = el.y;
    for (let i = 0; i < 4; i++) {
      draw7SegDigit(el.x, yy, el.w, rowH - 2, thick, digits[i]);
      yy += rowH;
    }
  } else if (el.style === 'text') {
    let xx = el.x;
    for (const ch of str) {
      drawGLCDFontChar(xx, el.y, ch.charCodeAt(0), s);
      xx += 6 * s;
    }
  } else {
    // default: microhex
    const glyphW = (MHEX_WIDTH + 1) * s;
    let xx = el.x;
    for (const c of str.split('').map(Number)) {
      drawMicroHexDigit(xx, el.y, c, s);
      xx += glyphW;
    }
  }
}

function drawSecondsElement(el, now) {
  const ss = String(now.getSeconds()).padStart(2, '0');
  const s = el.scale || 1;
  const s = microhexScaleFor(el, str.length);

  if (el.style === '7seg') {
    const digitW = Math.floor((el.w - 2) / 2);
    const h = el.h;
    const thick = Math.max(1, Math.round(Math.min(digitW, h) / 6));
    const y = el.y + Math.floor((el.h - h) / 2);
    draw7SegDigit(el.x, y, digitW, h, thick, Number(ss[0]));
    draw7SegDigit(el.x + digitW + 2, y, digitW, h, thick, Number(ss[1]));
  } else if (el.style === 'text') {
    let xx = el.x;
    for (const ch of ss) {
      drawGLCDFontChar(xx, el.y, ch.charCodeAt(0), s);
      xx += 6 * s;
    }
  } else {
    // default: microhex
    const glyphW = (MHEX_WIDTH + 1) * s;
    let xx = el.x;
    for (const c of ss.split('').map(Number)) {
      drawMicroHexDigit(xx, el.y, c, s);
      xx += glyphW;
    }
  }
}
 
function drawDateElement(el, now) {
  const s = el.scale || 1;
  const rot = el.rotation || 0;
  const mm = String(now.getMonth() + 1).padStart(2, '0');
  const dd = String(now.getDate()).padStart(2, '0');
  const s = microhexScaleFor(el, str.length);

  let str = '';
  switch (el.format || 'MMDD') {
    case 'DDMM': str = dd + mm; break;
    case 'MM':   str = mm;      break;
    case 'DD':   str = dd;      break;
    case 'MMDD':
    default:     str = mm + dd; break;
  }

  if (el.style === 'text') {
    let xx = el.x;
    for (const ch of str) {
      drawGLCDFontChar(xx, el.y, ch.charCodeAt(0), s);
      xx += 6 * s;
    }
    return;
  }

  // microhex (default)
  const digits = str.split('').map(Number);
  const glyphW = (MHEX_WIDTH + 1) * s;
  const glyphH = (MHEX_HEIGHT + 1) * s;

  if (rot === 90 || rot === 270) {
    let yy = el.y;
    for (const c of digits) {
      drawMicroHexDigit(el.x, yy, c, s);
      yy += glyphH;
    }
  } else {
    let xx = el.x;
    for (const c of digits) {
      drawMicroHexDigit(xx, el.y, c, s);
      xx += glyphW;
    }
  }
}

function drawPlaceholder(x, y, w, h, label) {
  ctx.save();
  ctx.strokeStyle = '#f80';
  ctx.setLineDash([2, 2]);
  ctx.strokeRect(x * SCALE + 0.5, y * SCALE + 0.5, w * SCALE, h * SCALE);
  ctx.fillStyle = '#f80';
  ctx.font = `${Math.floor(h * SCALE * 0.5)}px system-ui`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, (x + w / 2) * SCALE, (y + h / 2) * SCALE);
  ctx.restore();
}

// ============================================================
// Main render dispatcher
// ============================================================
function render() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (currentMode === 'anim') {
    renderAnim();
    updateAnimStatus();
  } else {
    renderFace();
    updateFaceStatus();
  }
}

function renderAnim() {
  ctx.fillStyle = '#ffffff';
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      if (pixels[idx(x, y)]) ctx.fillRect(x * SCALE, y * SCALE, SCALE, SCALE);
    }
  }
  drawGrid();
}

function updateAnimStatus() {
  let count = 0;
  for (let i = 0; i < pixels.length; i++) if (pixels[i]) count++;
  document.getElementById('status').textContent =
    `${W}×${H} • ${count} px on • zoom ${SCALE}×`;
}

function updateFaceStatus() {
  document.getElementById('status').textContent =
    `${W}×${H} • ${elements.length} element${elements.length===1?'':'s'} • face mode`;
}

// ============================================================
// Placement helpers
// ============================================================
function overlapsAny(x, y, w, h) {
  for (const el of elements) {
    if (x < el.x + el.w && x + w > el.x &&
        y < el.y + el.h && y + h > el.y) {
      return true;
    }
  }
  return false;
}

function findFreeSpot(w, h) {
  const step = 4;
  for (let y = 0; y <= H - h; y += step) {
    for (let x = 0; x <= W - w; x += step) {
      if (!overlapsAny(x, y, w, h)) return { x, y };
    }
  }
  return {
    x: Math.max(0, Math.floor((W - w) / 2)),
    y: Math.max(0, Math.floor((H - h) / 2)),
  };
}

function addElement(type) {
  const defaults = {
    time: { w: 32, h: 56, style: '7seg', thick: 3, scale: 1 },
    seconds: { w: 20, h: 10, style: '7seg' },  
    date:    { w: 26, h: 16, style: 'microhex', scale: 2, format: 'MMDD' },
    weekday: { w: 16, h: 16 },
    weather: { w: 16, h: 16 },
    temp:    { w: 26, h: 16, style: 'microhex', scale: 2 },
    bar:     { w: 4,  h: 48, axis: 'v', source: 'time.hourProgress' },
    text: { w: 32, h: 16, content: 'Hello', scale: 1 },
  };
  const def = defaults[type];
  if (!def) return;

  const { w, h, ...props } = def;
  const spot = findFreeSpot(w, h);

  const el = {
    id: nextId++,
    type,
    x: spot.x,
    y: spot.y,
    w,
    h,
    ...props,
  };
  elements.push(el);
  selectedId = el.id;
  rebuildProps();
  render();
}

// ============================================================
// Palette & properties rebuild
// ============================================================
function rebuildPalette() {
  const body = document.getElementById('paletteBody');
  if (currentMode === 'anim') {
    body.innerHTML = `
      <button id="btnClear">Clear</button>
      <button id="btnInvert">Invert</button>
      <button id="btnUndo">Undo</button>
      <button id="btnDemo">Load demo pattern</button>
    `;
    wireAnimTools();
  } else {
    body.innerHTML = `
      <h2 style="font-size:12px;margin-top:0">Add Element</h2>
      <button data-add="time">Time</button>
      <button data-add="seconds">Seconds</button>
      <button data-add="date">Date</button>
      <button data-add="weekday">Weekday</button>
      <button data-add="weather">Weather</button>
      <button data-add="temp">Temp</button>
      <button data-add="bar">Bar</button>
      <button data-add="text">Text</button>
    `;
    body.querySelectorAll('[data-add]').forEach(btn => {
      btn.onclick = () => addElement(btn.dataset.add);
    });
  }
}

function rebuildProps() {
  const body = document.getElementById('propsBody');
  const fx   = document.getElementById('effectsBox');

  if (currentMode === 'face') {
    fx.style.display = '';
    if (selectedId === null) {
      body.innerHTML = '<div id="propsEmpty">Click an element to select</div>';
      return;
    }
    const el = elements.find(e => e.id === selectedId);
    if (!el) {
      selectedId = null;
      body.innerHTML = '<div id="propsEmpty">Click an element to select</div>';
      return;
    }
     function microhexScaleFor(el, charCount) {
       const sH = Math.floor(el.h / MHEX_HEIGHT);
       const sW = Math.floor(el.w / (charCount * (MHEX_WIDTH + 1)));
       return Math.max(1, Math.min(sH, sW, 6));
     }
    const dateFields = el.type === 'date' ? `
      <div class="prop-row">
        <label>Format</label>
        <select id="propFormat">
          <option value="MMDD" ${el.format==='MMDD'?'selected':''}>MMDD (0918)</option>
          <option value="DDMM" ${el.format==='DDMM'?'selected':''}>DDMM (1809)</option>
          <option value="MM"   ${el.format==='MM'?'selected':''}>MM (09)</option>
          <option value="DD"   ${el.format==='DD'?'selected':''}>DD (18)</option>
        </select>
      </div>
    ` : '';
       const rotateFields = ['date', 'temp', 'text'].includes(el.type) ? `
      <div class="prop-row">
        <label>Rotation</label>
        <select id="propRotation">
          <option value="0"   ${(el.rotation||0)===0  ?'selected':''}>0°</option>
          <option value="90"  ${(el.rotation||0)===90 ?'selected':''}>90°</option>
          <option value="180" ${(el.rotation||0)===180?'selected':''}>180°</option>
          <option value="270" ${(el.rotation||0)===270?'selected':''}>270°</option>
        </select>
      </div>
    ` : '';
       const textFields = el.type === 'text' ? `
      <div class="prop-row">
        <label>Content</label>
        <input type="text" id="propContent" value="${el.content || ''}" style="width:140px;text-align:left">
      </div>
    ` : '';
       const styleFields = ['time', 'seconds', 'date', 'temp'].includes(el.type) ? `
      <div class="prop-row">
        <label>Style</label>
        <select id="propStyle">
          ${el.type === 'time' || el.type === 'seconds' ? `
            <option value="7seg"     ${el.style==='7seg'    ?'selected':''}>7-seg</option>
          ` : ''}
          <option value="microhex" ${el.style==='microhex'?'selected':''}>Microhex</option>
          <option value="text"     ${el.style==='text'    ?'selected':''}>Text (5x7)</option>
        </select>
      </div>
    ` : '';

    body.innerHTML = `
      <div style="font-size:12px;color:#aaa;margin-bottom:8px">
        <strong style="color:#fff;text-transform:capitalize">${el.type}</strong>
        ${el.style ? `<span style="color:#888"> · ${el.style}</span>` : ''}
      </div>
      <div class="prop-row"><label>X</label>
        <input type="number" id="propX" value="${el.x}" min="0" max="${W-1}"></div>
      <div class="prop-row"><label>Y</label>
        <input type="number" id="propY" value="${el.y}" min="0" max="${H-1}"></div>
      <div class="prop-row"><label>W</label>
        <input type="number" id="propW" value="${el.w}" min="1" max="${W}"></div>
      <div class="prop-row"><label>H</label>
        <input type="number" id="propH" value="${el.h}" min="1" max="${H}"></div>
      ${el.thick !== undefined ? `<div class="prop-row"><label>Thick</label>
        <input type="number" id="propThick" value="${el.thick}" min="1" max="10"></div>` : ''}
      ${el.scale !== undefined ? `<div class="prop-row"><label>Scale</label>
        <input type="number" id="propScale" value="${el.scale}" min="1" max="6"></div>` : ''}
      ${dateFields}
      ${rotateFields}
      ${textFields}
      ${styleFields}
      <button id="propDelete" style="
        margin-top:16px;
        background:#4a2020;
        border-color:#833;
        color:#fbb;
      ">Delete Element</button>
      <div style="font-size:11px;color:#666;margin-top:12px">
        Drag body to move · drag corners to resize
      </div>
    `;

    const bind = (id, key) => {
      const input = document.getElementById(id);
      if (!input) return;
      input.oninput = () => {
        const v = parseInt(input.value, 10);
        if (isNaN(v)) return;
        el[key] = v;
        el.x = Math.max(0, Math.min(W - el.w, el.x));
        el.y = Math.max(0, Math.min(H - el.h, el.y));
        el.w = Math.max(1, Math.min(W, el.w));
        el.h = Math.max(1, Math.min(H, el.h));
        render();
      };
    };
    bind('propX', 'x');
    bind('propY', 'y');
    bind('propW', 'w');
    bind('propH', 'h');
    if (el.thick !== undefined) bind('propThick', 'thick');
    if (el.scale !== undefined) bind('propScale', 'scale');

    const fmt = document.getElementById('propFormat');
    if (fmt) {
      fmt.onchange = () => {
        el.format = fmt.value;
        render();
      };
    }

       const rot = document.getElementById('propRotation');
    if (rot) {
      rot.onchange = () => {
        const newRot = parseInt(rot.value, 10);
        const oldRot = el.rotation || 0;
        const isVerticalNew = (newRot === 90 || newRot === 270);
        const isVerticalOld = (oldRot === 90 || oldRot === 270);

        // Swap W/H if the orientation changed between horizontal and vertical
        if (isVerticalNew !== isVerticalOld) {
          const t = el.w;
          el.w = el.h;
          el.h = t;
          // Keep in bounds after swap
          el.x = Math.max(0, Math.min(W - el.w, el.x));
          el.y = Math.max(0, Math.min(H - el.h, el.y));
        }

        el.rotation = newRot;
        rebuildProps();   // refresh the W/H fields to show swapped values
        render();
      };
    }

        const styleSel = document.getElementById('propStyle');
     if (styleSel) {
       styleSel.onchange = () => {
         el.style = styleSel.value;
         rebuildProps();
         render();
       };
     }
       const content = document.getElementById('propContent');
    if (content) {
      content.oninput = () => {
        el.content = content.value;
        render();
      };
    }

    const del = document.getElementById('propDelete');
    if (del) {
      del.onclick = () => {
        const idx = elements.findIndex(e => e.id === el.id);
        if (idx < 0) return;
        if (!confirm(`Delete the ${el.type} element?`)) return;
        elements.splice(idx, 1);
        selectedId = null;
        rebuildProps();
        render();
      };
    }
  } else {
    fx.style.display = 'none';
    body.innerHTML = '<div id="propsEmpty">Drawing tools active</div>';
  }
}

// ============================================================
// Animation tools
// ============================================================
function wireAnimTools() {
  const btnClear  = document.getElementById('btnClear');
  const btnInvert = document.getElementById('btnInvert');
  const btnUndo   = document.getElementById('btnUndo');
  const btnDemo   = document.getElementById('btnDemo');

  if (btnClear)  btnClear.onclick  = () => { pushUndo(); pixels.fill(0); render(); };
  if (btnInvert) btnInvert.onclick = () => { pushUndo(); for (let i=0;i<pixels.length;i++) pixels[i]^=1; render(); };
  if (btnUndo)   btnUndo.onclick   = () => { if(!undoStack.length) return; pixels = undoStack.pop(); render(); };
  if (btnDemo)   btnDemo.onclick   = () => {
    pushUndo(); pixels.fill(0);
    for (let x=0;x<W;x++){pixels[idx(x,0)]=1;pixels[idx(x,H-1)]=1;}
    for (let y=0;y<H;y++){pixels[idx(0,y)]=1;pixels[idx(W-1,y)]=1;}
    render();
  };
}

// ============================================================
// Effects checkboxes
// ============================================================
function wireEffects() {
  const map = {
    fxScanline: 'scanline',
    fxGlitch:   'glitch',
    fxJitter:   'jitter',
    fxCorners:  'corners',
    fxStatus:   'status',
    fxAd:       'ad',
  };
  for (const [id, key] of Object.entries(map)) {
    const el = document.getElementById(id);
    el.checked = effects[key];
    el.onchange = () => {
      effects[key] = el.checked;
      render();
    };
  }
}

// ============================================================
// Mode switching
// ============================================================
function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.tabs button').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  canvas.classList.toggle('face-mode', mode === 'face');
  rebuildPalette();
  rebuildProps();
  render();
}

document.querySelectorAll('.tabs button').forEach(btn => {
  btn.onclick = () => setMode(btn.dataset.mode);
});

// ============================================================
// Animation drawing input handlers
// ============================================================
let mouseDown = false;
let paintValue = 1;
let lastCell = null;

function cellFromEvent(e) {
  const r = canvas.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) / SCALE);
  const y = Math.floor((e.clientY - r.top)  / SCALE);
  if (x < 0 || x >= W || y < 0 || y >= H) return null;
  return { x, y };
}

function paint(cell) {
  if (!cell) return;
  const i = idx(cell.x, cell.y);
  if (pixels[i] === paintValue) return;
  pixels[i] = paintValue;
  ctx.fillStyle = paintValue ? '#ffffff' : '#000';
  ctx.fillRect(cell.x * SCALE, cell.y * SCALE, SCALE, SCALE);
  updateAnimStatus();
}

function pushUndo() {
  undoStack.push(new Uint8Array(pixels));
  if (undoStack.length > 50) undoStack.shift();
}

canvas.addEventListener('mousedown', e => {
  if (currentMode !== 'anim') return;
  mouseDown = true;
  pushUndo();
  const cell = cellFromEvent(e);
  if (!cell) return;
  paintValue = pixels[idx(cell.x, cell.y)] ? 0 : 1;
  lastCell = null;
  paint(cell);
});

canvas.addEventListener('mousemove', e => {
  if (currentMode !== 'anim' || !mouseDown) return;
  const cell = cellFromEvent(e);
  if (!cell) return;
  if (lastCell && (cell.x !== lastCell.x || cell.y !== lastCell.y)) {
    lineTo(lastCell, cell);
  } else {
    paint(cell);
  }
  lastCell = cell;
});

function lineTo(a, b) {
  let x0 = a.x, y0 = a.y;
  const x1 = b.x, y1 = b.y;
  const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1;
  const dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  while (true) {
    paint({ x: x0, y: y0 });
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}

canvas.addEventListener('mouseup',    () => { mouseDown = false; lastCell = null; });
canvas.addEventListener('mouseleave', () => { mouseDown = false; lastCell = null; });

// ============================================================
// FACE MODE INTERACTION
// ============================================================
let dragState = null;

function elementAtPoint(px, py) {
  for (let i = elements.length - 1; i >= 0; i--) {
    const el = elements[i];
    if (px >= el.x && px < el.x + el.w &&
        py >= el.y && py < el.y + el.h) {
      return el;
    }
  }
  return null;
}

function canvasToPixel(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  return {
    x: Math.floor((clientX - r.left) / SCALE),
    y: Math.floor((clientY - r.top)  / SCALE),
  };
}

function handleAtPoint(clientX, clientY) {
  if (selectedId === null) return null;
  const el = elements.find(e => e.id === selectedId);
  if (!el) return null;

  const r = canvas.getBoundingClientRect();
  const sx = clientX - r.left;
  const sy = clientY - r.top;
  const half = HANDLE_SIZE / 2 + 2;

  const corners = {
    TL: [el.x * SCALE,            el.y * SCALE],
    TR: [(el.x + el.w) * SCALE,   el.y * SCALE],
    BL: [el.x * SCALE,            (el.y + el.h) * SCALE],
    BR: [(el.x + el.w) * SCALE,   (el.y + el.h) * SCALE],
  };
  for (const [name, [cx, cy]] of Object.entries(corners)) {
    if (Math.abs(sx - cx) <= half && Math.abs(sy - cy) <= half) return name;
  }
  return null;
}

canvas.addEventListener('mousedown', e => {
  if (currentMode !== 'face') return;

  const handle = handleAtPoint(e.clientX, e.clientY);
  if (handle) {
    const el = elements.find(el => el.id === selectedId);
    dragState = {
      mode: 'resize',
      handle,
      el,
      startX: el.x,
      startY: el.y,
      startW: el.w,
      startH: el.h,
      startPx: canvasToPixel(e.clientX, e.clientY),
    };
    e.preventDefault();
    return;
  }

  const p = canvasToPixel(e.clientX, e.clientY);
  const hit = elementAtPoint(p.x, p.y);
  if (hit) {
    selectedId = hit.id;
    dragState = {
      mode: 'move',
      el: hit,
      offsetX: p.x - hit.x,
      offsetY: p.y - hit.y,
    };
  } else {
    selectedId = null;
    dragState = null;
  }
  rebuildProps();
  render();
});

canvas.addEventListener('mousemove', e => {
  if (currentMode !== 'face' || !dragState) return;
  const p = canvasToPixel(e.clientX, e.clientY);

  if (dragState.mode === 'move') {
    const el = dragState.el;
    let nx = p.x - dragState.offsetX;
    let ny = p.y - dragState.offsetY;
    nx = Math.max(0, Math.min(W - el.w, nx));
    ny = Math.max(0, Math.min(H - el.h, ny));
    el.x = nx;
    el.y = ny;
  } else if (dragState.mode === 'resize') {
    const el = dragState.el;
    const start = dragState.startPx;
    const dx = p.x - start.x;
    const dy = p.y - start.y;

    let newX = dragState.startX;
    let newY = dragState.startY;
    let newW = dragState.startW;
    let newH = dragState.startH;

    switch (dragState.handle) {
      case 'TL':
        newX = dragState.startX + dx;
        newY = dragState.startY + dy;
        newW = dragState.startW - dx;
        newH = dragState.startH - dy;
        break;
      case 'TR':
        newY = dragState.startY + dy;
        newW = dragState.startW + dx;
        newH = dragState.startH - dy;
        break;
      case 'BL':
        newX = dragState.startX + dx;
        newW = dragState.startW - dx;
        newH = dragState.startH + dy;
        break;
      case 'BR':
        newW = dragState.startW + dx;
        newH = dragState.startH + dy;
        break;
    }

    const MIN = 4;

    // Force square for icon element types
    const squareTypes = new Set(['weekday', 'weather']);
    if (squareTypes.has(el.type)) {
      const size = Math.max(MIN, Math.round((newW + newH) / 2));
      newW = size;
      newH = size;
      if (dragState.handle === 'TL' || dragState.handle === 'BL') {
        newX = dragState.startX + dragState.startW - size;
      }
      if (dragState.handle === 'TL' || dragState.handle === 'TR') {
        newY = dragState.startY + dragState.startH - size;
      }
    }

    if (newW < MIN) newW = MIN;
    if (newH < MIN) newH = MIN;
    if (newX < 0) newX = 0;
    if (newY < 0) newY = 0;
    if (newX + newW > W) newW = W - newX;
    if (newY + newH > H) newH = H - newY;

    el.x = newX;
    el.y = newY;
    el.w = newW;
    el.h = newH;
  }

  render();
});

canvas.addEventListener('mouseup', () => {
  if (currentMode !== 'face') return;
  if (dragState) {
    dragState = null;
    rebuildProps();
  }
});

canvas.addEventListener('mouseleave', () => {
  if (currentMode !== 'face') return;
  if (dragState) {
    dragState = null;
    rebuildProps();
  }
});

// ============================================================
// BLE
// ============================================================
const SERVICE = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const RX_CHAR = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';

let bleDevice = null;
let bleServer = null;
let bleRxChar = null;
let bleConnected = false;

const btnConnect = document.getElementById('btnConnect');
const btnSend    = document.getElementById('btnSend');
const connStatus = document.getElementById('connStatus');

function setConnUI(state, msg) {
  connStatus.classList.remove('connected', 'error');
  connStatus.textContent = msg;

  if (state === 'disconnected') {
    btnConnect.textContent = 'Connect to Watch';
    btnConnect.disabled = false;
    btnSend.disabled = true;
    bleConnected = false;
  } else if (state === 'connecting') {
    btnConnect.textContent = 'Connecting…';
    btnConnect.disabled = true;
    btnSend.disabled = true;
    bleConnected = false;
  } else if (state === 'connected') {
    btnConnect.textContent = 'Disconnect';
    btnConnect.disabled = false;
    btnSend.disabled = false;
    bleConnected = true;
    connStatus.classList.add('connected');
  } else if (state === 'error') {
    btnConnect.textContent = 'Connect to Watch';
    btnConnect.disabled = false;
    btnSend.disabled = true;
    bleConnected = false;
    connStatus.classList.add('error');
  }
}

async function doConnect() {
  if (!navigator.bluetooth) {
    setConnUI('error', 'Web Bluetooth not supported in this browser');
    return;
  }
  try {
    setConnUI('connecting', 'Requesting device…');
    bleDevice = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE] }],
      optionalServices: [SERVICE]
    });

    bleDevice.addEventListener('gattserverdisconnected', () => {
      bleServer = null;
      bleRxChar = null;
      setConnUI('disconnected', 'Disconnected');
    });

    setConnUI('connecting', 'Connecting…');
    bleServer = await bleDevice.gatt.connect();

    setConnUI('connecting', 'Finding service…');
    const service = await bleServer.getPrimaryService(SERVICE);

    setConnUI('connecting', 'Finding characteristic…');
    bleRxChar = await service.getCharacteristic(RX_CHAR);

    setConnUI('connected', `Connected: ${bleDevice.name || 'watch'}`);
  } catch (e) {
    console.error(e);
    setConnUI('error', `Error: ${e.message}`);
  }
}

function doDisconnect() {
  try {
    if (bleDevice && bleDevice.gatt.connected) bleDevice.gatt.disconnect();
  } catch (_) {}
  setConnUI('disconnected', 'Disconnected');
}

btnConnect.onclick = () => {
  if (bleConnected) doDisconnect();
  else doConnect();
};

// ============================================================
// Build outgoing JSON
// ============================================================
function buildAnimJson() {
  const bytesPerRow = Math.ceil(W / 8);
  const packed = new Uint8Array(bytesPerRow * H);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      if (pixels[idx(x, y)]) {
        const byteIndex = y * bytesPerRow + (x >> 3);
        const bitIndex  = x & 7;
        packed[byteIndex] |= (1 << bitIndex);
      }
    }
  }
  let binary = '';
  for (let i = 0; i < packed.length; i++) binary += String.fromCharCode(packed[i]);
  const b64 = btoa(binary);

  return JSON.stringify({
    kind: 'animation',
    v: 1,
    name: 'untitled',
    w: W, h: H,
    format: 'bitpacked-row-lsb',
    overlays: false,
    data: b64
  });
}

function buildFaceConfigJson() {
  return JSON.stringify({
    kind: 'face',
    v: 1,
    name: 'untitled',
    effects: effects,
    elements: elements
  });
}

function buildPayload() {
  return currentMode === 'anim' ? buildAnimJson() : buildFaceConfigJson();
}

// ============================================================
// Send to watch
// ============================================================
const CHUNK_SIZE = 180;

async function sendToWatch() {
  if (!bleConnected || !bleRxChar) throw new Error('Not connected');

  const json = buildPayload();
  const payload = new TextEncoder().encode(json);

  if (payload.length > 0xFFFF) throw new Error('Payload too large (>64 KB)');

  const frame = new Uint8Array(2 + payload.length);
  frame[0] = payload.length & 0xFF;
  frame[1] = (payload.length >> 8) & 0xFF;
  frame.set(payload, 2);

  let sent = 0;
  while (sent < frame.length) {
    const slice = frame.slice(sent, sent + CHUNK_SIZE);
    if (bleRxChar.writeValueWithoutResponse) {
      await bleRxChar.writeValueWithoutResponse(slice);
    } else {
      await bleRxChar.writeValue(slice);
    }
    sent += slice.length;
    connStatus.textContent = `Sending… ${sent}/${frame.length}`;
  }

  connStatus.textContent = `Sent ${payload.length} bytes (${frame.length} on wire)`;
}

btnSend.onclick = async () => {
  try {
    btnSend.disabled = true;
    connStatus.classList.remove('error');
    await sendToWatch();
    connStatus.classList.add('connected');
  } catch (e) {
    console.error(e);
    setConnUI('connected', `Send error: ${e.message}`);
    connStatus.classList.remove('connected');
    connStatus.classList.add('error');
  } finally {
    btnSend.disabled = false;
  }
};

// ============================================================
// Boot
// ============================================================
wireEffects();
setMode('face');

setInterval(() => {
  scanY = (scanY + 1) % H;
  if (currentMode === 'face') render();
}, 250);
</script>
