
<!doctype html>
<meta charset="utf-8">
<button id="go">Connect & Send "hello watch"</button>
<pre id="log"></pre>
<script>
const log = (s) => document.getElementById('log').textContent += s + '\n';
const SERVICE = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const RX_CHAR = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';

document.getElementById('go').onclick = async () => {
  try {
    const device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE] }],
      optionalServices: [SERVICE]
    });
    log('Device: ' + device.name);
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE);
    const rx = await service.getCharacteristic(RX_CHAR);
    const data = new TextEncoder().encode('hello watch');
    await rx.writeValue(data);
    log('Sent ' + data.length + ' bytes');
  } catch (e) {
    log('Error: ' + e.message);
  }
};
</script>
