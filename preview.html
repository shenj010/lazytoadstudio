<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>1-bit preview — 32×96</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    background: #1a1a1a; color: #e0e0e0;
    margin: 0; padding: 20px;
    display: flex; gap: 24px; align-items: flex-start;
  }
  .panel { display: flex; flex-direction: column; gap: 12px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: #888; margin: 0; }
  canvas { image-rendering: pixelated; display: block; background: #000; border: 1px solid #333; }
  #srcPreview { max-width: 240px; max-height: 240px; }
  label { font-size: 13px; color: #aaa; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  input[type=range] { width: 200px; }
  input[type=number] { width: 60px; background: #222; color: #e0e0e0; border: 1px solid #444; padding: 2px 6px; border-radius: 3px; }
  select { background: #222; color: #e0e0e0; border: 1px solid #444; padding: 4px; border-radius: 3px; }
  button { background: #333; color: #e0e0e0; border: 1px solid #555; padding: 8px 14px; border-radius: 4px; cursor: pointer; }
  button:hover { background: #444; }
  #frames { display: flex; gap: 2px; flex-wrap: wrap; max-width: 520px; }
  #frames canvas { border: 1px solid #222; }
  .row { display: flex; gap: 10px; align-items: center; }
  #status { font-size: 12px; color: #888; }
</style>
</head>
<body>

<div class="panel">
  <h2>Source</h2>
  <input type="file" id="fileInput" accept="video/*,image/gif">
  <canvas id="srcPreview" width="320" height="320"></canvas>
  <video id="video" style="display:none" muted playsinline></video>

  <h2>Conversion</h2>
  <label>Start (s) <input type="number" id="start" value="0" step="0.1" min="0"></label>
  <label>Length (s) <input type="number" id="length" value="5" step="0.5" min="0.5" max="5"></label>
  <label>FPS <input type="number" id="fps" value="8" min="1" max="12"></label>

  <label>Threshold <input type="range" id="threshold" min="0" max="255" value="128"></label>
  <label>Dither
    <select id="dither">
      <option value="none">None (hard threshold)</option>
      <option value="bayer4">Ordered 4×4</option>
      <option value="bayer8">Ordered 8×8</option>
      <option value="fs" selected>Floyd–Steinberg</option>
      <option value="atkinson">Atkinson</option>
    </select>
  </label>
  <label>Invert <input type="checkbox" id="invert"></label>

  <button id="btnConvert">Convert</button>
  <div id="status">—</div>
</div>

<div class="panel">
  <h2>Output frames (32×96 each)</h2>
  <canvas id="outPreview" width="192" height="576"
          style="image-rendering: pixelated; transform: scale(1); border: 1px solid #333;"></canvas>
  <div id="frames"></div>
</div>

<script>
const OUT_W = 32;
const OUT_H = 96;
const SCALE = 6;   // preview zoom

const fileInput = document.getElementById('fileInput');
const video     = document.getElementById('video');
const srcPrev   = document.getElementById('srcPreview');
const srcCtx    = srcPrev.getContext('2d');
const outPrev   = document.getElementById('outPreview');
const outCtx    = outPrev.getContext('2d');
const framesDiv = document.getElementById('frames');
const statusEl  = document.getElementById('status');

let isGif = false;
let gifFrames = [];      // for GIF path
let gifFrameIdx = 0;

fileInput.onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  framesDiv.innerHTML = '';
  outCtx.clearRect(0, 0, outPrev.width, outPrev.height);
  gifFrames = [];
  isGif = file.type === 'image/gif' || file.name.toLowerCase().endsWith('.gif');

  if (isGif) {
    statusEl.textContent = 'GIF: decoding…';
    // Minimal GIF loader — just uses browser's Image element to grab frames.
    // (Note: this only shows the first frame for preview; real GIF support
    //  needs gifuct-js or similar. For now, treat GIF as a still preview.)
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      srcPrev.width = img.width;
      srcPrev.height = img.height;
      srcCtx.drawImage(img, 0, 0);
      statusEl.textContent = 'GIF loaded (single-frame preview only — see note)';
    };
    img.src = url;
    return;
  }

  // Video path
  const url = URL.createObjectURL(file);
  video.src = url;
  video.onloadedmetadata = () => {
    srcPrev.width = video.videoWidth;
    srcPrev.height = video.videoHeight;
    srcCtx.drawImage(video, 0, 0, srcPrev.width, srcPrev.height);
    statusEl.textContent = `Loaded: ${video.videoWidth}×${video.videoHeight}, ${video.duration.toFixed(1)}s`;
  };
};

// ---------- dithering ----------

// Bayer 4x4 matrix, normalized to 0..1
const BAYER4 = [
  [ 0, 8, 2,10],
  [12, 4,14, 6],
  [ 3,11, 1, 9],
  [15, 7,13, 5],
].map(row => row.map(v => v / 16));

const BAYER8 = (() => {
  // Generate 8x8 from 4x4 recursively
  const b = [];
  for (let y = 0; y < 8; y++) {
    b.push([]);
    for (let x = 0; x < 8; x++) {
      const m4 = BAYER4[y % 4][x % 4];
      const quad = (Math.floor(y/4) * 2 + Math.floor(x/4));
      b[y].push((m4 + quad * (1/4)) / 4 + (m4 / 4));
    }
  }
  return b.map(row => row.map(v => v % 1));
})();

function thresholdValue(v, x, y, thresh, ditherMode) {
  // v: 0..255 grayscale. Returns 0 or 255.
  switch (ditherMode) {
    case 'bayer4': {
      const t = thresh + (BAYER4[y & 3][x & 3] - 0.5) * 128;
      return v > t ? 255 : 0;
    }
    case 'bayer8': {
      const t = thresh + (BAYER8[y & 7][x & 7] - 0.5) * 128;
      return v > t ? 255 : 0;
    }
    default:
      return v > thresh ? 255 : 0;
  }
}

function ditherFS(gray, w, h, thresh) {
  // gray: Float32Array of 0..255, modified in place
  const out = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = y * w + x;
      const old = gray[i];
      const nv = old > thresh ? 255 : 0;
      out[i] = nv;
      const err = old - nv;
      if (x + 1 < w) gray[i + 1]       += err * 7/16;
      if (y + 1 < h) {
        if (x > 0)     gray[i + w - 1] += err * 3/16;
                       gray[i + w]     += err * 5/16;
        if (x + 1 < w) gray[i + w + 1] += err * 1/16;
      }
    }
  }
  return out;
}

function ditherAtkinson(gray, w, h, thresh) {
  const out = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = y * w + x;
      const old = gray[i];
      const nv = old > thresh ? 255 : 0;
      out[i] = nv;
      const err = (old - nv) / 8;
      const push = (xx, yy) => {
        if (xx >= 0 && xx < w && yy >= 0 && yy < h) gray[yy * w + xx] += err;
      };
      push(x + 1, y);
      push(x + 2, y);
      push(x - 1, y + 1);
      push(x,     y + 1);
      push(x + 1, y + 1);
      push(x,     y + 2);
    }
  }
  return out;
}

// ---------- frame extraction ----------

function extractFrameAt(t) {
  return new Promise((resolve) => {
    const onSeeked = () => {
      video.removeEventListener('seeked', onSeeked);
      // Draw to a temp canvas at source resolution
      const tmp = document.createElement('canvas');
      tmp.width = video.videoWidth;
      tmp.height = video.videoHeight;
      tmp.getContext('2d').drawImage(video, 0, 0);
      resolve(tmp);
    };
    video.addEventListener('seeked', onSeeked);
    video.currentTime = t;
  });
}

function fitToOutput(srcCanvas) {
  // Crop to 1:3 aspect, then draw into 32x96
  const sw = srcCanvas.width, sh = srcCanvas.height;
  const targetAspect = OUT_W / OUT_H;    // ~0.333
  const srcAspect = sw / sh;
  let cw, ch, cx, cy;
  if (srcAspect > targetAspect) {
    // source is wider — crop sides
    ch = sh;
    cw = sh * targetAspect;
    cx = (sw - cw) / 2;
    cy = 0;
  } else {
    cw = sw;
    ch = sw / targetAspect;
    cx = 0;
    cy = (sh - ch) / 2;
  }
  const out = document.createElement('canvas');
  out.width = OUT_W;
  out.height = OUT_H;
  const octx = out.getContext('2d');
  octx.imageSmoothingEnabled = true;
  octx.imageSmoothingQuality = 'high';
  octx.drawImage(srcCanvas, cx, cy, cw, ch, 0, 0, OUT_W, OUT_H);
  return out;
}

function toGray(canvas) {
  const c = canvas.getContext('2d');
  const img = c.getImageData(0, 0, canvas.width, canvas.height);
  const gray = new Float32Array(canvas.width * canvas.height);
  const invert = document.getElementById('invert').checked;
  for (let i = 0; i < gray.length; i++) {
    const r = img.data[i*4+0];
    const g = img.data[i*4+1];
    const b = img.data[i*4+2];
    let v = 0.2126*r + 0.7152*g + 0.0722*b;
    if (invert) v = 255 - v;
    gray[i] = v;
  }
  return gray;
}

function ditherGray(gray, mode, thresh) {
  const th = parseInt(document.getElementById('threshold').value, 10);
  const t = (thresh !== undefined) ? thresh : th;
  if (mode === 'fs')       return ditherFS(gray, OUT_W, OUT_H, t);
  if (mode === 'atkinson') return ditherAtkinson(gray, OUT_W, OUT_H, t);
  const out = new Uint8Array(OUT_W * OUT_H);
  for (let y = 0; y < OUT_H; y++) {
    for (let x = 0; x < OUT_W; x++) {
      const i = y * OUT_W + x;
      out[i] = thresholdValue(gray[i], x, y, t, mode);
    }
  }
  return out;
}

function renderBitFrameToCanvas(outCtx, bitmap, scale) {
  outCtx.fillStyle = '#000';
  outCtx.fillRect(0, 0, OUT_W * scale, OUT_H * scale);
  outCtx.fillStyle = '#fff';
  for (let y = 0; y < OUT_H; y++) {
    for (let x = 0; x < OUT_W; x++) {
      if (bitmap[y * OUT_W + x]) {
        outCtx.fillRect(x * scale, y * scale, scale, scale);
      }
    }
  }
}

// ---------- main convert ----------

document.getElementById('btnConvert').onclick = async () => {
  if (isGif || !video.src) {
    statusEl.textContent = 'Load a video first (GIF not supported in this test snippet).';
    return;
  }
  const start = parseFloat(document.getElementById('start').value) || 0;
  const length = Math.min(parseFloat(document.getElementById('length').value) || 5, 5);
  const fps = Math.min(parseInt(document.getElementById('fps').value, 10) || 8, 12);
  const ditherMode = document.getElementById('dither').value;

  const frameCount = Math.round(length * fps);
  const dt = 1 / fps;

  statusEl.textContent = `Extracting ${frameCount} frames…`;
  framesDiv.innerHTML = '';

  const bitmaps = [];
  for (let i = 0; i < frameCount; i++) {
    const t = start + i * dt;
    if (t > video.duration) break;
    const src = await extractFrameAt(t);
    const small = fitToOutput(src);
    const gray = toGray(small);
    const bitmap = ditherGray(gray, ditherMode);
    bitmaps.push(bitmap);

    // Show thumbnail in the strip
    const c = document.createElement('canvas');
    c.width = OUT_W;
    c.height = OUT_H;
    renderBitFrameToCanvas(c.getContext('2d'), bitmap, 1);
    framesDiv.appendChild(c);

    statusEl.textContent = `Extracting ${i + 1} / ${frameCount}…`;
  }

  // Play back in the big canvas
  statusEl.textContent = `Done — ${bitmaps.length} frames. Playing…`;
  const frameMs = 1000 / fps;
  let idx = 0;
  const tick = () => {
    renderBitFrameToCanvas(outCtx, bitmaps[idx], SCALE);
    idx = (idx + 1) % bitmaps.length;
    setTimeout(tick, frameMs);
  };
  tick();
};
</script>

</body>
</html>
