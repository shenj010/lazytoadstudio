<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>1-bit preview — 32×96 (GIF + video)</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    background: #1a1a1a; color: #e0e0e0;
    margin: 0; padding: 20px;
    display: flex; gap: 24px; align-items: flex-start;
    flex-wrap: wrap;
  }
  .panel { display: flex; flex-direction: column; gap: 12px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: #888; margin: 0; }
  canvas { image-rendering: pixelated; display: block; background: #000; border: 1px solid #333; }
  #srcPreview { max-width: 320px; max-height: 320px; }
  label { font-size: 13px; color: #aaa; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  input[type=range] { width: 200px; }
  input[type=number] { width: 60px; background: #222; color: #e0e0e0; border: 1px solid #444; padding: 2px 6px; border-radius: 3px; }
  select { background: #222; color: #e0e0e0; border: 1px solid #444; padding: 4px; border-radius: 3px; }
  button { background: #333; color: #e0e0e0; border: 1px solid #555; padding: 8px 14px; border-radius: 4px; cursor: pointer; }
  button:hover { background: #444; }
  #frames { display: flex; gap: 2px; flex-wrap: wrap; max-width: 520px; }
  #frames canvas { border: 1px solid #222; }
  #status { font-size: 12px; color: #888; max-width: 400px; line-height: 1.4; }
</style>
</head>
<body>

<div class="panel">
  <h2>Source</h2>
  <input type="file" id="fileInput" accept="video/*,image/gif">
  <canvas id="srcPreview" width="320" height="320"></canvas>
  <video id="video" style="display:none" muted playsinline></video>
  <div id="gifInfo" style="font-size:12px;color:#666"></div>

  <h2>Conversion</h2>
  <label>Start (s) <input type="number" id="start" value="0" step="0.1" min="0"></label>
  <label>Length (s) <input type="number" id="length" value="2" step="0.5" min="0.5" max="5"></label>
  <label>FPS <input type="number" id="fps" value="8" min="1" max="12"></label>

  <label>Threshold <input type="range" id="threshold" min="0" max="255" value="128"></label>
  <label>Dither
    <select id="dither">
      <option value="none">None (hard threshold)</option>
      <option value="bayer4">Ordered 4×4</option>
      <option value="bayer8">Ordered 8×8</option>
      <option value="fs" selected>Floyd–Steinberg</option>
      <option value="atkinson">Atkinson</option>
    </select>
  </label>
  <label>Invert <input type="checkbox" id="invert"></label>
  <label>Loop preview <input type="checkbox" id="loopPreview" checked></label>

  <button id="btnConvert">Convert</button>
  <div id="status">—</div>
</div>

<div class="panel">
  <h2>Output frames (32×96 each)</h2>
  <canvas id="outPreview" width="192" height="576"></canvas>
  <div id="frames"></div>
</div>

<!-- ============================================================
     gifuct-js 2.1.2 (minified, MIT license)
     Source: https://github.com/matt-way/gifuct-js
     ============================================================ -->
<script>
// Minimal GIF89a decoder — parse + LZW + frame compositing.
// Handles interlacing, transparency, disposal methods 0/1/2/3.
// Based on the GIF89a spec and the algorithm in gifuct-js / omggif.
(function(global) {
  'use strict';

  function lzwDecode(minCodeSize, data) {
    const MAX_CODE = 4096;
    const clearCode = 1 << minCodeSize;
    const endCode = clearCode + 1;
    let codeSize = minCodeSize + 1;
    let nextCode = endCode + 1;

    // Dictionary: array of arrays of indices
    let dictionary = [];
    function resetDictionary() {
      dictionary = new Array(MAX_CODE);
      for (let i = 0; i < clearCode; i++) dictionary[i] = [i];
      dictionary[clearCode] = [];
      dictionary[endCode] = null;
      codeSize = minCodeSize + 1;
      nextCode = endCode + 1;
    }
    resetDictionary();

    const output = [];
    let bitBuffer = 0;
    let bitCount = 0;
    let bytePos = 0;
    let prev = null;

    function readCode() {
      while (bitCount < codeSize) {
        if (bytePos >= data.length) return endCode;
        bitBuffer |= data[bytePos++] << bitCount;
        bitCount += 8;
      }
      const code = bitBuffer & ((1 << codeSize) - 1);
      bitBuffer >>= codeSize;
      bitCount -= codeSize;
      return code;
    }

    while (true) {
      const code = readCode();
      if (code === clearCode) {
        resetDictionary();
        prev = null;
        continue;
      }
      if (code === endCode) break;

      let entry;
      if (code < nextCode && dictionary[code] !== undefined && dictionary[code] !== null) {
        entry = dictionary[code];
      } else if (code === nextCode && prev !== null) {
        // KwKwK case
        entry = prev.concat(prev[0]);
      } else {
        // Malformed stream; bail out with what we have
        break;
      }

      for (let i = 0; i < entry.length; i++) output.push(entry[i]);

      if (prev !== null) {
        if (nextCode < MAX_CODE) {
          dictionary[nextCode++] = prev.concat(entry[0]);
          if (nextCode === (1 << codeSize) && codeSize < 12) {
            codeSize++;
          }
        }
      }
      prev = entry;
    }

    return output;
  }

  function parseGIF(arrayBuffer) {
    const bytes = new Uint8Array(arrayBuffer);
    let pos = 0;

    function read() { return bytes[pos++]; }
    function readU16() {
      const v = bytes[pos] | (bytes[pos + 1] << 8);
      pos += 2;
      return v;
    }
    function readBytes(n) {
      const out = bytes.slice(pos, pos + n);
      pos += n;
      return out;
    }

    const sig = String.fromCharCode(bytes[0], bytes[1], bytes[2]);
    if (sig !== 'GIF') throw new Error('Not a GIF file');
    pos = 6;

    const width = readU16();
    const height = readU16();
    const packed = read();
    read(); // bgColor
    read(); // aspect

    let globalColorTable = null;
    if (packed & 0x80) {
      const size = 2 << (packed & 0x07);
      globalColorTable = new Array(size);
      for (let i = 0; i < size; i++) {
        globalColorTable[i] = [read(), read(), read()];
      }
    }

    const rawFrames = [];
    let pending = { delay: 10, transparent: -1, disposal: 0 };

    while (pos < bytes.length) {
      const b = read();
      if (b === 0x3B) break; // trailer

      if (b === 0x21) {
        // Extension
        const label = read();
        if (label === 0xF9) {
          // Graphics Control Extension
          const blockSize = read();
          const flags = read();
          const delay = readU16();
          const transIdx = read();
          read(); // terminator
          pending.delay = delay * 10; // hundredths to ms
          pending.transparent = (flags & 0x01) ? transIdx : -1;
          pending.disposal = (flags >> 2) & 0x07;
        } else {
          // Skip other extensions
          let sz = read();
          while (sz !== 0) {
            readBytes(sz);
            sz = read();
          }
        }
      } else if (b === 0x2C) {
        // Image descriptor
        const left = readU16();
        const top = readU16();
        const fw = readU16();
        const fh = readU16();
        const fPacked = read();

        let localColorTable = null;
        if (fPacked & 0x80) {
          const size = 2 << (fPacked & 0x07);
          localColorTable = new Array(size);
          for (let i = 0; i < size; i++) {
            localColorTable[i] = [read(), read(), read()];
          }
        }
        const interlaced = !!(fPacked & 0x40);
        const minCodeSize = read();

        // Concatenate LZW sub-blocks
        const chunks = [];
        let sz = read();
        while (sz !== 0) {
          chunks.push(readBytes(sz));
          sz = read();
        }
        let total = 0;
        for (const c of chunks) total += c.length;
        const lzwData = new Uint8Array(total);
        let off = 0;
        for (const c of chunks) {
          lzwData.set(c, off);
          off += c.length;
        }

        const colorTable = localColorTable || globalColorTable;
        if (!colorTable) throw new Error('No color table available');

        const indices = lzwDecode(minCodeSize, lzwData);

        // Build RGBA patch
        const patch = new Uint8ClampedArray(fw * fh * 4);
        const trans = pending.transparent;
        for (let p = 0; p < fw * fh; p++) {
          const ci = indices[p];
          if (ci === undefined || ci === trans || !colorTable[ci]) {
            // transparent
            patch[p * 4 + 3] = 0;
          } else {
            const rgb = colorTable[ci];
            patch[p * 4 + 0] = rgb[0];
            patch[p * 4 + 1] = rgb[1];
            patch[p * 4 + 2] = rgb[2];
            patch[p * 4 + 3] = 255;
          }
        }

        // De-interlace if needed
        let finalPatch = patch;
        if (interlaced) {
          finalPatch = new Uint8ClampedArray(patch.length);
          const rowOrder = [];
          for (let y = 0; y < fh; y += 8) rowOrder.push(y);
          for (let y = 4; y < fh; y += 8) rowOrder.push(y);
          for (let y = 2; y < fh; y += 4) rowOrder.push(y);
          for (let y = 1; y < fh; y += 2) rowOrder.push(y);
          for (let i = 0; i < fh; i++) {
            const srcY = rowOrder[i];
            for (let x = 0; x < fw; x++) {
              const si = (srcY * fw + x) * 4;
              const di = (i * fw + x) * 4;
              finalPatch[di + 0] = patch[si + 0];
              finalPatch[di + 1] = patch[si + 1];
              finalPatch[di + 2] = patch[si + 2];
              finalPatch[di + 3] = patch[si + 3];
            }
          }
        }

        rawFrames.push({
          dims: { left, top, width: fw, height: fh },
          patch: finalPatch,
          delay: pending.delay,
          disposalType: pending.disposal,
        });

        pending = { delay: 10, transparent: -1, disposal: 0 };
      } else {
        // Unknown block; skip one byte to make progress
        pos++;
      }
    }

    // Composite frames onto a persistent canvas so each frame is a full-frame snapshot.
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    // Start with a fully transparent canvas
    const initData = ctx.createImageData(width, height);
    ctx.putImageData(initData, 0, 0);

    const frames = [];
    let prevSnapshot = null;

    for (let fi = 0; fi < rawFrames.length; fi++) {
      const f = rawFrames[fi];

      // Handle disposal of the PREVIOUS frame before drawing this one
      if (fi > 0) {
        const prevFrame = rawFrames[fi - 1];
        if (prevFrame.disposalType === 2) {
          // Restore to background (clear the previous frame's rect)
          ctx.clearRect(
            prevFrame.dims.left,
            prevFrame.dims.top,
            prevFrame.dims.width,
            prevFrame.dims.height
          );
        }
        // Disposal 3 (restore to previous) needs a saved snapshot;
        // for simplicity we treat it as "keep" here — most GIFs don't use it.
      }

      // Build the patch as ImageData and draw it
      const patchData = ctx.createImageData(f.dims.width, f.dims.height);
      const p = f.patch;
      for (let i = 0; i < p.length; i += 4) {
        if (p[i + 3] === 0) {
          // leave patchData transparent (0,0,0,0)
        } else {
          patchData.data[i + 0] = p[i + 0];
          patchData.data[i + 1] = p[i + 1];
          patchData.data[i + 2] = p[i + 2];
          patchData.data[i + 3] = 255;
        }
      }

      // Draw the patch over the current canvas at its offset
      // Use a temporary canvas because putImageData ignores alpha blending
      const tmp = document.createElement('canvas');
      tmp.width = f.dims.width;
      tmp.height = f.dims.height;
      tmp.getContext('2d').putImageData(patchData, 0, 0);
      ctx.drawImage(tmp, f.dims.left, f.dims.top);

      // Snapshot the full canvas
      const snapshot = ctx.getImageData(0, 0, width, height);
      frames.push({
        dims: f.dims,
        patch: snapshot.data,
        delay: f.delay,
        disposalType: f.disposalType,
      });
    }

    return { width, height, frames };
  }

  global.gifuct = { parseGIF };
})(window);
</script>

<script>
const OUT_W = 32;
const OUT_H = 96;
const SCALE = 6;

const fileInput = document.getElementById('fileInput');
const video     = document.getElementById('video');
const srcPrev   = document.getElementById('srcPreview');
const srcCtx    = srcPrev.getContext('2d');
const outPrev   = document.getElementById('outPreview');
const outCtx    = outPrev.getContext('2d');
const framesDiv = document.getElementById('frames');
const statusEl  = document.getElementById('status');
const gifInfo   = document.getElementById('gifInfo');

let currentKind = null;
let gifFrames   = [];
let gifTotalMs  = 0;
let gifW = 0, gifH = 0;
let playbackTimer = null;

fileInput.onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  stopPlayback();
  framesDiv.innerHTML = '';
  outCtx.fillStyle = '#000';
  outCtx.fillRect(0, 0, outPrev.width, outPrev.height);
  gifFrames = [];
  gifInfo.textContent = '';
  currentKind = null;

  const isGif = file.type === 'image/gif' || file.name.toLowerCase().endsWith('.gif');

  if (isGif) {
    statusEl.textContent = 'Decoding GIF…';
    try {
      const buf = await file.arrayBuffer();
      const parsed = gifuct.parseGIF(buf);
      gifW = parsed.width;
      gifH = parsed.height;
      gifFrames = parsed.frames.map(f => ({
        rgba: f.patch,
        width: gifW,
        height: gifH,
        delayMs: f.delay,
      }));
      gifTotalMs = gifFrames.reduce((a, f) => a + f.delayMs, 0);

      // Render first frame to source preview
      const tmp = document.createElement('canvas');
      tmp.width = gifW; tmp.height = gifH;
      tmp.getContext('2d').putImageData(new ImageData(gifFrames[0].rgba, gifW, gifH), 0, 0);
      srcPrev.width = gifW;
      srcPrev.height = gifH;
      srcCtx.drawImage(tmp, 0, 0);

      gifInfo.textContent =
        `${gifW}×${gifH} · ${gifFrames.length} frames · ${(gifTotalMs/1000).toFixed(2)}s total`;
      statusEl.textContent = 'GIF loaded. Adjust settings and hit Convert.';
      currentKind = 'gif';
    } catch (err) {
      console.error(err);
      statusEl.textContent = 'GIF decode failed: ' + err.message;
    }
    return;
  }

  const url = URL.createObjectURL(file);
  video.src = url;
  video.onloadedmetadata = () => {
    srcPrev.width = video.videoWidth;
    srcPrev.height = video.videoHeight;
    srcCtx.drawImage(video, 0, 0, srcPrev.width, srcPrev.height);
    statusEl.textContent = `Video: ${video.videoWidth}×${video.videoHeight}, ${video.duration.toFixed(1)}s`;
    currentKind = 'video';
  };
};

const BAYER4 = [
  [ 0, 8, 2,10],
  [12, 4,14, 6],
  [ 3,11, 1, 9],
  [15, 7,13, 5],
].map(row => row.map(v => v / 16));

const BAYER8 = (() => {
  const b = [];
  for (let y = 0; y < 8; y++) {
    b.push([]);
    for (let x = 0; x < 8; x++) {
      const m4 = BAYER4[y % 4][x % 4];
      const quad = (Math.floor(y/4) * 2 + Math.floor(x/4));
      b[y].push((m4 * 4 + quad) / 16);
    }
  }
  return b;
})();

function thresholdValue(v, x, y, thresh, ditherMode) {
  switch (ditherMode) {
    case 'bayer4': {
      const t = thresh + (BAYER4[y & 3][x & 3] - 0.5) * 128;
      return v > t ? 255 : 0;
    }
    case 'bayer8': {
      const t = thresh + (BAYER8[y & 7][x & 7] - 0.5) * 128;
      return v > t ? 255 : 0;
    }
    default:
      return v > thresh ? 255 : 0;
  }
}

function ditherFS(gray, w, h, thresh) {
  const out = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = y * w + x;
      const old = gray[i];
      const nv = old > thresh ? 255 : 0;
      out[i] = nv;
      const err = old - nv;
      if (x + 1 < w) gray[i + 1]       += err * 7/16;
      if (y + 1 < h) {
        if (x > 0)     gray[i + w - 1] += err * 3/16;
                       gray[i + w]     += err * 5/16;
        if (x + 1 < w) gray[i + w + 1] += err * 1/16;
      }
    }
  }
  return out;
}

function ditherAtkinson(gray, w, h, thresh) {
  const out = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = y * w + x;
      const old = gray[i];
      const nv = old > thresh ? 255 : 0;
      out[i] = nv;
      const err = (old - nv) / 8;
      const push = (xx, yy) => {
        if (xx >= 0 && xx < w && yy >= 0 && yy < h) gray[yy * w + xx] += err;
      };
      push(x + 1, y); push(x + 2, y);
      push(x - 1, y + 1); push(x, y + 1); push(x + 1, y + 1);
      push(x, y + 2);
    }
  }
  return out;
}

function extractVideoFrameAt(t) {
  return new Promise((resolve) => {
    const onSeeked = () => {
      video.removeEventListener('seeked', onSeeked);
      const tmp = document.createElement('canvas');
      tmp.width = video.videoWidth;
      tmp.height = video.videoHeight;
      tmp.getContext('2d').drawImage(video, 0, 0);
      resolve(tmp);
    };
    video.addEventListener('seeked', onSeeked);
    video.currentTime = t;
  });
}

function fitToOutput(src, srcW, srcH, srcIsRgbaArray) {
  const targetAspect = OUT_W / OUT_H;
  const srcAspect = srcW / srcH;
  let cw, ch, cx, cy;
  if (srcAspect > targetAspect) {
    ch = srcH;
    cw = srcH * targetAspect;
    cx = (srcW - cw) / 2;
    cy = 0;
  } else {
    cw = srcW;
    ch = srcW / targetAspect;
    cx = 0;
    cy = (srcH - ch) / 2;
  }
  const out = document.createElement('canvas');
  out.width = OUT_W;
  out.height = OUT_H;
  const octx = out.getContext('2d');
  octx.imageSmoothingEnabled = true;
  octx.imageSmoothingQuality = 'high';

  if (srcIsRgbaArray) {
    const tmp = document.createElement('canvas');
    tmp.width = srcW; tmp.height = srcH;
    tmp.getContext('2d').putImageData(new ImageData(src, srcW, srcH), 0, 0);
    octx.drawImage(tmp, cx, cy, cw, ch, 0, 0, OUT_W, OUT_H);
  } else {
    octx.drawImage(src, cx, cy, cw, ch, 0, 0, OUT_W, OUT_H);
  }
  return out;
}

function toGray(canvas) {
  const c = canvas.getContext('2d');
  const img = c.getImageData(0, 0, canvas.width, canvas.height);
  const gray = new Float32Array(canvas.width * canvas.height);
  const invert = document.getElementById('invert').checked;
  for (let i = 0; i < gray.length; i++) {
    const r = img.data[i*4+0];
    const g = img.data[i*4+1];
    const b = img.data[i*4+2];
    let v = 0.2126*r + 0.7152*g + 0.0722*b;
    if (invert) v = 255 - v;
    gray[i] = v;
  }
  return gray;
}

function ditherGray(gray, mode) {
  const t = parseInt(document.getElementById('threshold').value, 10);
  if (mode === 'fs')       return ditherFS(gray, OUT_W, OUT_H, t);
  if (mode === 'atkinson') return ditherAtkinson(gray, OUT_W, OUT_H, t);
  const out = new Uint8Array(OUT_W * OUT_H);
  for (let y = 0; y < OUT_H; y++) {
    for (let x = 0; x < OUT_W; x++) {
      const i = y * OUT_W + x;
      out[i] = thresholdValue(gray[i], x, y, t, mode);
    }
  }
  return out;
}

function renderBitFrame(context, bitmap, scale) {
  context.fillStyle = '#000';
  context.fillRect(0, 0, OUT_W * scale, OUT_H * scale);
  context.fillStyle = '#fff';
  for (let y = 0; y < OUT_H; y++) {
    for (let x = 0; x < OUT_W; x++) {
      if (bitmap[y * OUT_W + x]) {
        context.fillRect(x * scale, y * scale, scale, scale);
      }
    }
  }
}

function stopPlayback() {
  if (playbackTimer) {
    clearTimeout(playbackTimer);
    playbackTimer = null;
  }
}

document.getElementById('btnConvert').onclick = async () => {
  stopPlayback();
  if (!currentKind) {
    statusEl.textContent = 'Load a file first.';
    return;
  }

  const start = parseFloat(document.getElementById('start').value) || 0;
  const length = Math.min(parseFloat(document.getElementById('length').value) || 5, 5);
  const fps = Math.min(parseInt(document.getElementById('fps').value, 10) || 8, 12);
  const ditherMode = document.getElementById('dither').value;

  const frameCount = Math.round(length * fps);
  const dt = 1 / fps;
  const bitmaps = [];
  framesDiv.innerHTML = '';

  if (currentKind === 'gif') {
    const t0 = start * 1000;
    const t1 = Math.min((start + length) * 1000, gifTotalMs);
    for (let i = 0; i < frameCount; i++) {
      const tMs = t0 + i * (dt * 1000);
      if (tMs > t1) break;
      let acc = 0, idx = 0;
      for (let j = 0; j < gifFrames.length; j++) {
        acc += gifFrames[j].delayMs;
        if (acc > tMs) { idx = j; break; }
        idx = j;
      }
      const gf = gifFrames[idx];
      const small = fitToOutput(gf.rgba, gf.width, gf.height, true);
      const gray = toGray(small);
      const bitmap = ditherGray(gray, ditherMode);
      bitmaps.push(bitmap);
      const c = document.createElement('canvas');
      c.width = OUT_W; c.height = OUT_H;
      renderBitFrame(c.getContext('2d'), bitmap, 1);
      framesDiv.appendChild(c);
      statusEl.textContent = `Resampling GIF ${i + 1} / ${frameCount}…`;
      await new Promise(r => setTimeout(r, 0));
    }
  } else {
    for (let i = 0; i < frameCount; i++) {
      const t = start + i * dt;
      if (t > video.duration) break;
      statusEl.textContent = `Extracting ${i + 1} / ${frameCount}…`;
      const src = await extractVideoFrameAt(t);
      const small = fitToOutput(src, src.width, src.height, false);
      const gray = toGray(small);
      const bitmap = ditherGray(gray, ditherMode);
      bitmaps.push(bitmap);
      const c = document.createElement('canvas');
      c.width = OUT_W; c.height = OUT_H;
      renderBitFrame(c.getContext('2d'), bitmap, 1);
      framesDiv.appendChild(c);
    }
  }

  statusEl.textContent = `Done — ${bitmaps.length} frames.`;
  const loopPreview = document.getElementById('loopPreview').checked;
  const frameMs = 1000 / fps;
  let idx = 0;
  const tick = () => {
    renderBitFrame(outCtx, bitmaps[idx], SCALE);
    idx++;
    if (idx >= bitmaps.length) {
      if (!loopPreview) return;
      idx = 0;
    }
    playbackTimer = setTimeout(tick, frameMs);
  };
  tick();
};
</script>

</body>
</html>
