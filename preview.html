<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>1-bit preview — 32×96 (GIF + video)</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    background: #1a1a1a; color: #e0e0e0;
    margin: 0; padding: 20px;
    display: flex; gap: 24px; align-items: flex-start;
    flex-wrap: wrap;
  }
  .panel { display: flex; flex-direction: column; gap: 12px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: #888; margin: 0; }
  canvas { image-rendering: pixelated; display: block; background: #000; border: 1px solid #333; }
  #srcPreview { max-width: 360px; max-height: 360px; }
  label { font-size: 13px; color: #aaa; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  input[type=range] { width: 200px; }
  input[type=number] { width: 60px; background: #222; color: #e0e0e0; border: 1px solid #444; padding: 2px 6px; border-radius: 3px; }
  select { background: #222; color: #e0e0e0; border: 1px solid #444; padding: 4px; border-radius: 3px; }
  button { background: #333; color: #e0e0e0; border: 1px solid #555; padding: 8px 14px; border-radius: 4px; cursor: pointer; }
  button:hover { background: #444; }
  #frames { display: flex; gap: 2px; flex-wrap: wrap; max-width: 520px; }
  #frames canvas { border: 1px solid #222; }
  #status { font-size: 12px; color: #888; max-width: 400px; line-height: 1.4; }
  .section-divider {
    border-top: 1px solid #333;
    padding-top: 12px;
    margin-top: 4px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #666;
  }
</style>
</head>
<body>

<div class="panel">
  <h2>Source</h2>
  <input type="file" id="fileInput" accept="video/*,image/gif">
  <canvas id="srcPreview" width="360" height="360"></canvas>
  <video id="video" style="display:none" muted playsinline></video>
  <div id="gifInfo" style="font-size:12px;color:#666"></div>

  <h2>Framing</h2>
  <label>Start (s) <input type="number" id="start" value="0" step="0.1" min="0"></label>
  <label>Length (s) <input type="number" id="length" value="2" step="0.5" min="0.5" max="10"></label>
  <label>FPS <input type="number" id="fps" value="8" min="1" max="12"></label>
  <label>Zoom <input type="range" id="zoom" min="0.2" max="4" step="0.05" value="1"></label>
  <label>Crop X <input type="range" id="cropX" min="0" max="100" value="50"></label>
  <label>Crop Y <input type="range" id="cropY" min="0" max="100" value="50"></label>

  <div class="section-divider">Tone</div>
  <label>Contrast stretch <input type="checkbox" id="stretch" checked></label>
  <label>Gamma <input type="range" id="gamma" min="0.4" max="2.5" step="0.05" value="1.0"></label>
  <label>Sharpen <input type="range" id="sharpen" min="0" max="2" step="0.05" value="0.5"></label>
  <label>Auto threshold <input type="checkbox" id="autoThresh"></label>
  <label>Threshold <input type="range" id="threshold" min="0" max="255" value="128"></label>

  <div class="section-divider">Output</div>
  <label>Downsample
    <select id="downsample">
      <option value="lanczos" selected>Lanczos 3</option>
      <option value="area">Area average</option>
      <option value="bilinear">Bilinear</option>
    </select>
  </label>
  <label>Dither
    <select id="dither">
      <option value="none">None (hard threshold)</option>
      <option value="bayer4">Ordered 4×4</option>
      <option value="bayer8">Ordered 8×8</option>
      <option value="fs" selected>Floyd–Steinberg</option>
      <option value="atkinson">Atkinson</option>
    </select>
  </label>
  <label>Invert <input type="checkbox" id="invert"></label>
  <label>Loop preview <input type="checkbox" id="loopPreview" checked></label>

  <button id="btnConvert">Convert</button>
  <div id="status">—</div>
</div>

<div class="panel">
  <h2>Output frames (32×96 each)</h2>
  <canvas id="outPreview" width="192" height="576"></canvas>
  <div id="frames"></div>
</div>

<script>
/* ============================================================
   GIF decoding
   Primary: browser-native ImageDecoder (Chrome 94+, Edge)
   Fallback: hand-rolled GIF89a decoder below
   ============================================================ */

async function decodeGifNative(file) {
  const decoder = new ImageDecoder({
    data: await file.arrayBuffer(),
    type: 'image/gif'
  });

  // Wait for both the decoder AND its tracks to be ready
  await decoder.completed;
  await decoder.tracks.ready;

  let track = decoder.tracks.selectedTrack;

  // Some Chrome versions return null briefly — poll a few times
  let attempts = 0;
  while (!track && attempts < 20) {
    await new Promise(r => setTimeout(r, 20));
    track = decoder.tracks.selectedTrack;
    attempts++;
  }
  if (!track) throw new Error('No selected track on decoded GIF');

  let frameCount = track.frameCount;
  if (!frameCount) {
    // track.frameCount can be 0 until first decode — decode frame 0 to kick it
    await decoder.decode({ frameIndex: 0 });
    frameCount = track.frameCount;
  }
  if (!frameCount) throw new Error('GIF reported 0 frames');

  const frames = [];

  for (let i = 0; i < frameCount; i++) {
    const { image } = await decoder.decode({ frameIndex: i });
    const canvas = document.createElement('canvas');
    canvas.width = image.displayWidth;
    canvas.height = image.displayHeight;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(image, 0, 0);
    const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    // duration is in microseconds
    const delayMs = Math.max(20, Math.round((image.duration || 100000) / 1000));
    frames.push({
      rgba: new Uint8ClampedArray(data),
      width: canvas.width,
      height: canvas.height,
      delayMs,
    });
  }

  return { width: frames[0].width, height: frames[0].height, frames };
}
function hasNativeGifDecoder() {
  return typeof window.ImageDecoder !== 'undefined';
}

/* ============================================================
   Fallback GIF89a decoder
   ============================================================ */
(function(global) {
  'use strict';

  function lzwDecode(minCodeSize, data) {
    const MAX_CODE = 4096;
    const clearCode = 1 << minCodeSize;
    const endCode = clearCode + 1;
    let codeSize = minCodeSize + 1;
    let nextCode = endCode + 1;

    let dictionary = [];
    function resetDictionary() {
      dictionary = new Array(MAX_CODE);
      for (let i = 0; i < clearCode; i++) dictionary[i] = [i];
      dictionary[clearCode] = [];
      dictionary[endCode] = null;
      codeSize = minCodeSize + 1;
      nextCode = endCode + 1;
    }
    resetDictionary();

    const output = [];
    let bitBuffer = 0;
    let bitCount = 0;
    let bytePos = 0;
    let prev = null;

    function readCode() {
      while (bitCount < codeSize) {
        if (bytePos >= data.length) return endCode;
        bitBuffer |= data[bytePos++] << bitCount;
        bitCount += 8;
      }
      const code = bitBuffer & ((1 << codeSize) - 1);
      bitBuffer >>= codeSize;
      bitCount -= codeSize;
      return code;
    }

    while (true) {
      const code = readCode();
      if (code === clearCode) { resetDictionary(); prev = null; continue; }
      if (code === endCode) break;

      let entry;
      if (code < nextCode && dictionary[code] !== undefined && dictionary[code] !== null) {
        entry = dictionary[code];
      } else if (code === nextCode && prev !== null) {
        entry = prev.concat(prev[0]);
      } else break;

      for (let i = 0; i < entry.length; i++) output.push(entry[i]);

      if (prev !== null) {
        if (nextCode < MAX_CODE) {
          dictionary[nextCode++] = prev.concat(entry[0]);
          if (nextCode === (1 << codeSize) && codeSize < 12) codeSize++;
        }
      }
      prev = entry;
    }
    return output;
  }

  function parseGIF(arrayBuffer) {
    const bytes = new Uint8Array(arrayBuffer);
    let pos = 0;
    const read = () => bytes[pos++];
    const readU16 = () => { const v = bytes[pos] | (bytes[pos + 1] << 8); pos += 2; return v; };
    const readBytes = (n) => { const o = bytes.slice(pos, pos + n); pos += n; return o; };

    const sig = String.fromCharCode(bytes[0], bytes[1], bytes[2]);
    if (sig !== 'GIF') throw new Error('Not a GIF file');
    pos = 6;

    const width = readU16();
    const height = readU16();
    const packed = read();
    read(); read();

    let globalColorTable = null;
    if (packed & 0x80) {
      const size = 2 << (packed & 0x07);
      globalColorTable = new Array(size);
      for (let i = 0; i < size; i++) globalColorTable[i] = [read(), read(), read()];
    }

    const rawFrames = [];
    let pending = { delay: 10, transparent: -1, disposal: 0 };

    while (pos < bytes.length) {
      const b = read();
      if (b === 0x3B) break;

      if (b === 0x21) {
        const label = read();
        if (label === 0xF9) {
          const blockSize = read();
          const flags = read();
          const delay = readU16();
          const transIdx = read();
          read();
          pending.delay = (delay || 10) * 10;
          pending.transparent = (flags & 0x01) ? transIdx : -1;
          pending.disposal = (flags >> 2) & 0x07;
        } else {
          let sz = read();
          while (sz !== 0) { readBytes(sz); sz = read(); }
        }
      } else if (b === 0x2C) {
        const left = readU16();
        const top = readU16();
        const fw = readU16();
        const fh = readU16();
        const fPacked = read();

        let localColorTable = null;
        if (fPacked & 0x80) {
          const size = 2 << (fPacked & 0x07);
          localColorTable = new Array(size);
          for (let i = 0; i < size; i++) localColorTable[i] = [read(), read(), read()];
        }
        const interlaced = !!(fPacked & 0x40);
        const minCodeSize = read();

        const chunks = [];
        let sz = read();
        while (sz !== 0) { chunks.push(readBytes(sz)); sz = read(); }
        let total = 0;
        for (const c of chunks) total += c.length;
        const lzwData = new Uint8Array(total);
        let off = 0;
        for (const c of chunks) { lzwData.set(c, off); off += c.length; }

        const colorTable = localColorTable || globalColorTable;
        if (!colorTable) throw new Error('No color table available');

        const indices = lzwDecode(minCodeSize, lzwData);

        // Build pixel indices, de-interlacing if needed
        const orderedIndices = new Uint8Array(fw * fh);
        if (interlaced) {
          const rowOrder = [];
          for (let y = 0; y < fh; y += 8) rowOrder.push(y);
          for (let y = 4; y < fh; y += 8) rowOrder.push(y);
          for (let y = 2; y < fh; y += 4) rowOrder.push(y);
          for (let y = 1; y < fh; y += 2) rowOrder.push(y);
          let srcIdx = 0;
          for (let i = 0; i < fh; i++) {
            const dstY = rowOrder[i];
            for (let x = 0; x < fw; x++) {
              orderedIndices[dstY * fw + x] = indices[srcIdx++] || 0;
            }
          }
        } else {
          for (let i = 0; i < fw * fh; i++) {
            orderedIndices[i] = indices[i] || 0;
          }
        }

        rawFrames.push({
          dims: { left, top, width: fw, height: fh },
          indices: orderedIndices,
          colorTable: colorTable,
          transparent: pending.transparent,
          delay: pending.delay,
          disposalType: pending.disposal,
        });
        pending = { delay: 10, transparent: -1, disposal: 0 };
      } else pos++;
    }

    // Composite onto a persistent canvas
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const frames = [];

    for (let fi = 0; fi < rawFrames.length; fi++) {
      const f = rawFrames[fi];
      if (fi > 0) {
        const prevFrame = rawFrames[fi - 1];
        if (prevFrame.disposalType === 2) {
          ctx.clearRect(prevFrame.dims.left, prevFrame.dims.top,
                        prevFrame.dims.width, prevFrame.dims.height);
        }
      }

      // Build RGBA patch
      const patchData = ctx.createImageData(f.dims.width, f.dims.height);
      const ct = f.colorTable;
      const trans = f.transparent;
      for (let p = 0; p < f.dims.width * f.dims.height; p++) {
        const ci = f.indices[p];
        if (ci === trans || !ct[ci]) {
          patchData.data[p * 4 + 3] = 0;
        } else {
          patchData.data[p * 4 + 0] = ct[ci][0];
          patchData.data[p * 4 + 1] = ct[ci][1];
          patchData.data[p * 4 + 2] = ct[ci][2];
          patchData.data[p * 4 + 3] = 255;
        }
      }

      const tmp = document.createElement('canvas');
      tmp.width = f.dims.width;
      tmp.height = f.dims.height;
      tmp.getContext('2d').putImageData(patchData, 0, 0);
      ctx.drawImage(tmp, f.dims.left, f.dims.top);

      const snapshot = ctx.getImageData(0, 0, width, height);
      frames.push({
        rgba: new Uint8ClampedArray(snapshot.data),
        width: width,
        height: height,
        delayMs: f.delay,
      });
    }

    return { width, height, frames };
  }

  global.gifuct = { parseGIF };
})(window);

/* ============================================================
   Main app
   ============================================================ */

const OUT_W = 32;
const OUT_H = 96;
const SCALE = 6;

const fileInput = document.getElementById('fileInput');
const video     = document.getElementById('video');
const srcPrev   = document.getElementById('srcPreview');
const srcCtx    = srcPrev.getContext('2d');
const outPrev   = document.getElementById('outPreview');
const outCtx    = outPrev.getContext('2d');
const framesDiv = document.getElementById('frames');
const statusEl  = document.getElementById('status');
const gifInfo   = document.getElementById('gifInfo');

let currentKind = null;
let gifFrames   = [];
let gifTotalMs  = 0;
let gifW = 0, gifH = 0;
let playbackTimer = null;

fileInput.onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  stopPlayback();
  framesDiv.innerHTML = '';
  outCtx.fillStyle = '#000';
  outCtx.fillRect(0, 0, outPrev.width, outPrev.height);
  gifFrames = [];
  gifInfo.textContent = '';
  currentKind = null;

  const isGif = file.type === 'image/gif' || file.name.toLowerCase().endsWith('.gif');

  if (isGif) {
    statusEl.textContent = 'Decoding GIF…';
    try {
      let parsed;
      if (hasNativeGifDecoder()) {
        parsed = await decodeGifNative(file);
      } else {
        const buf = await file.arrayBuffer();
        parsed = gifuct.parseGIF(buf);
      }
      gifW = parsed.width;
      gifH = parsed.height;
      gifFrames = parsed.frames.map(f => ({
        rgba: f.rgba,
        width: f.width || gifW,
        height: f.height || gifH,
        delayMs: f.delayMs,
      }));
      gifTotalMs = gifFrames.reduce((a, f) => a + f.delayMs, 0);
      renderSourceGifFrame(0);
      gifInfo.textContent =
        `${gifW}×${gifH} · ${gifFrames.length} frames · ${(gifTotalMs/1000).toFixed(2)}s total` +
        (hasNativeGifDecoder() ? '' : ' (fallback decoder)');
      statusEl.textContent = 'GIF loaded. Adjust settings and hit Convert.';
      currentKind = 'gif';
    } catch (err) {
      console.error(err);
      statusEl.textContent = 'GIF decode failed: ' + err.message;
    }
    return;
  }

  const url = URL.createObjectURL(file);
  video.src = url;
  video.onloadedmetadata = () => {
    srcPrev.width = video.videoWidth;
    srcPrev.height = video.videoHeight;
    srcCtx.drawImage(video, 0, 0, srcPrev.width, srcPrev.height);
    drawCropOverlay();
    statusEl.textContent = `Video: ${video.videoWidth}×${video.videoHeight}, ${video.duration.toFixed(1)}s`;
    currentKind = 'video';
  };
};

function renderSourceGifFrame(idx) {
  const gf = gifFrames[idx];
  const tmp = document.createElement('canvas');
  tmp.width = gf.width;
  tmp.height = gf.height;
  tmp.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(gf.rgba), gf.width, gf.height), 0, 0);
  srcPrev.width = gf.width;
  srcPrev.height = gf.height;
  srcCtx.drawImage(tmp, 0, 0);
  drawCropOverlay();
}

function drawCropOverlay() {
  if (!currentKind) return;
  const srcW = currentKind === 'gif' ? gifW : video.videoWidth;
  const srcH = currentKind === 'gif' ? gifH : video.videoHeight;
  if (!srcW || !srcH) return;

  const zoom = Math.max(0.1, parseFloat(document.getElementById('zoom').value) || 1);
  const cropXpct = (parseInt(document.getElementById('cropX').value, 10) || 50) / 100;
  const cropYpct = (parseInt(document.getElementById('cropY').value, 10) || 50) / 100;

  const coverScale = Math.max(OUT_W / srcW, OUT_H / srcH);
  const scale = coverScale * zoom;
  const scaledW = srcW * scale;
  const scaledH = srcH * scale;

  let rectX, rectY, rectW, rectH;
  if (scaledW >= OUT_W) {
    rectW = OUT_W / scale;
    rectX = ((scaledW - OUT_W) * cropXpct) / scale;
  } else { rectW = srcW; rectX = 0; }
  if (scaledH >= OUT_H) {
    rectH = OUT_H / scale;
    rectY = ((scaledH - OUT_H) * cropYpct) / scale;
  } else { rectH = srcH; rectY = 0; }

  const scaleX = srcPrev.width / srcW;
  const scaleY = srcPrev.height / srcH;

  srcCtx.save();
  srcCtx.fillStyle = 'rgba(0,0,0,0.55)';
  srcCtx.fillRect(0, 0, srcPrev.width, rectY * scaleY);
  srcCtx.fillRect(0, (rectY + rectH) * scaleY,
                  srcPrev.width, srcPrev.height - (rectY + rectH) * scaleY);
  srcCtx.fillRect(0, rectY * scaleY, rectX * scaleX, rectH * scaleY);
  srcCtx.fillRect((rectX + rectW) * scaleX, rectY * scaleY,
                  srcPrev.width - (rectX + rectW) * scaleX, rectH * scaleY);
  srcCtx.strokeStyle = '#3af';
  srcCtx.lineWidth = 2;
  srcCtx.strokeRect(rectX * scaleX, rectY * scaleY, rectW * scaleX, rectH * scaleY);
  srcCtx.restore();
}

function computeSrcRegion(srcW, srcH) {
  const zoom = Math.max(0.1, parseFloat(document.getElementById('zoom').value) || 1);
  const cropXpct = (parseInt(document.getElementById('cropX').value, 10) || 50) / 100;
  const cropYpct = (parseInt(document.getElementById('cropY').value, 10) || 50) / 100;

  const coverScale = Math.max(OUT_W / srcW, OUT_H / srcH);
  const scale = coverScale * zoom;

  const viewW = OUT_W / scale;
  const viewH = OUT_H / scale;

  let cx, cy;
  if (srcW > viewW) cx = (srcW - viewW) * cropXpct;
  else cx = (srcW - viewW) / 2;
  if (srcH > viewH) cy = (srcH - viewH) * cropYpct;
  else cy = (srcH - viewH) / 2;

  return { sx: cx, sy: cy, sw: viewW, sh: viewH };
}

function areaDownsample(srcData, srcW, srcH) {
  const { sx, sy, sw, sh } = computeSrcRegion(srcW, srcH);
  const out = new Float32Array(OUT_W * OUT_H * 3);
  const pixelW = sw / OUT_W;
  const pixelH = sh / OUT_H;

  for (let oy = 0; oy < OUT_H; oy++) {
    const y0 = sy + oy * pixelH;
    const y1 = y0 + pixelH;
    const iy0 = Math.max(0, Math.floor(y0));
    const iy1 = Math.min(srcH, Math.ceil(y1));

    for (let ox = 0; ox < OUT_W; ox++) {
      const x0 = sx + ox * pixelW;
      const x1 = x0 + pixelW;
      const ix0 = Math.max(0, Math.floor(x0));
      const ix1 = Math.min(srcW, Math.ceil(x1));

      let sumR = 0, sumG = 0, sumB = 0, sumW = 0;
      for (let y = iy0; y < iy1; y++) {
        const wy = Math.min(y1, y + 1) - Math.max(y0, y);
        if (wy <= 0) continue;
        for (let x = ix0; x < ix1; x++) {
          const wx = Math.min(x1, x + 1) - Math.max(x0, x);
          if (wx <= 0) continue;
          const w = wx * wy;
          const i = (y * srcW + x) * 4;
          const a = srcData[i + 3] / 255;
          sumR += srcData[i + 0] * w * a;
          sumG += srcData[i + 1] * w * a;
          sumB += srcData[i + 2] * w * a;
          sumW += w * a;
        }
      }
      const oi = (oy * OUT_W + ox) * 3;
      if (sumW > 0) {
        out[oi + 0] = sumR / sumW;
        out[oi + 1] = sumG / sumW;
        out[oi + 2] = sumB / sumW;
      }
    }
  }
  return out;
}

function lanczosKernel(x, a) {
  if (x === 0) return 1;
  const ax = Math.abs(x);
  if (ax >= a) return 0;
  const pix = Math.PI * x;
  return (a * Math.sin(pix) * Math.sin(pix / a)) / (pix * pix);
}

function lanczosDownsample(srcData, srcW, srcH) {
  const { sx, sy, sw, sh } = computeSrcRegion(srcW, srcH);
  const out = new Float32Array(OUT_W * OUT_H * 3);
  const A = 3;

  const scaleX = sw / OUT_W;
  const scaleY = sh / OUT_H;

  const colWeights = [];
  for (let ox = 0; ox < OUT_W; ox++) {
    const center = sx + (ox + 0.5) * scaleX - 0.5;
    const i0 = Math.floor(center - A * Math.max(1, scaleX));
    const i1 = Math.ceil(center + A * Math.max(1, scaleX));
    const weights = [];
    let wsum = 0;
    for (let i = i0; i <= i1; i++) {
      const w = lanczosKernel((i - center) / Math.max(1, scaleX), A);
      weights.push(w);
      wsum += w;
    }
    for (let k = 0; k < weights.length; k++) weights[k] /= wsum;
    colWeights.push({ i0, weights });
  }

  const rowWeights = [];
  for (let oy = 0; oy < OUT_H; oy++) {
    const center = sy + (oy + 0.5) * scaleY - 0.5;
    const i0 = Math.floor(center - A * Math.max(1, scaleY));
    const i1 = Math.ceil(center + A * Math.max(1, scaleY));
    const weights = [];
    let wsum = 0;
    for (let i = i0; i <= i1; i++) {
      const w = lanczosKernel((i - center) / Math.max(1, scaleY), A);
      weights.push(w);
      wsum += w;
    }
    for (let k = 0; k < weights.length; k++) weights[k] /= wsum;
    rowWeights.push({ i0, weights });
  }

  for (let oy = 0; oy < OUT_H; oy++) {
    const { i0: ry0, weights: rw } = rowWeights[oy];
    const tempRow = new Float32Array(srcW * 3);
    for (let i = 0; i < rw.length; i++) {
      const y = ry0 + i;
      if (y < 0 || y >= srcH) continue;
      const w = rw[i];
      if (w === 0) continue;
      const rowBase = y * srcW * 4;
      for (let x = 0; x < srcW; x++) {
        const si = rowBase + x * 4;
        const a = srcData[si + 3] / 255;
        tempRow[x * 3 + 0] += srcData[si + 0] * w * a;
        tempRow[x * 3 + 1] += srcData[si + 1] * w * a;
        tempRow[x * 3 + 2] += srcData[si + 2] * w * a;
      }
    }

    for (let ox = 0; ox < OUT_W; ox++) {
      const { i0: cx0, weights: cw } = colWeights[ox];
      let r = 0, g = 0, b = 0, wsum = 0;
      for (let i = 0; i < cw.length; i++) {
        const x = cx0 + i;
        if (x < 0 || x >= srcW) continue;
        const w = cw[i];
        if (w === 0) continue;
        r += tempRow[x * 3 + 0] * w;
        g += tempRow[x * 3 + 1] * w;
        b += tempRow[x * 3 + 2] * w;
        wsum += w;
      }
      const oi = (oy * OUT_W + ox) * 3;
      if (wsum > 0) {
        out[oi + 0] = r / wsum;
        out[oi + 1] = g / wsum;
        out[oi + 2] = b / wsum;
      }
    }
  }

  return out;
}

function bilinearDownsample(src, srcW, srcH, srcIsRgbaArray) {
  const { sx, sy, sw, sh } = computeSrcRegion(srcW, srcH);
  const out = document.createElement('canvas');
  out.width = OUT_W;
  out.height = OUT_H;
  const octx = out.getContext('2d');
  octx.imageSmoothingEnabled = true;
  octx.imageSmoothingQuality = 'high';
  octx.fillStyle = '#000';
  octx.fillRect(0, 0, OUT_W, OUT_H);

  let sourceEl;
  if (srcIsRgbaArray) {
    const tmp = document.createElement('canvas');
    tmp.width = srcW; tmp.height = srcH;
    tmp.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(src), srcW, srcH), 0, 0);
    sourceEl = tmp;
  } else {
    sourceEl = src;
  }

  octx.drawImage(sourceEl, sx, sy, sw, sh, 0, 0, OUT_W, OUT_H);

  const img = octx.getImageData(0, 0, OUT_W, OUT_H);
  const rgb = new Float32Array(OUT_W * OUT_H * 3);
  for (let i = 0; i < OUT_W * OUT_H; i++) {
    rgb[i * 3 + 0] = img.data[i * 4 + 0];
    rgb[i * 3 + 1] = img.data[i * 4 + 1];
    rgb[i * 3 + 2] = img.data[i * 4 + 2];
  }
  return rgb;
}

function srgbToLinear(v) {
  const c = v / 255;
  return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
}

function rgbToGrayLinear(rgb, invert) {
  const n = OUT_W * OUT_H;
  const gray = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const lr = srgbToLinear(rgb[i*3]);
    const lg = srgbToLinear(rgb[i*3+1]);
    const lb = srgbToLinear(rgb[i*3+2]);
    let v = 0.2126 * lr + 0.7152 * lg + 0.0722 * lb;
    if (invert) v = 1 - v;
    gray[i] = v;
  }
  return gray;
}

function applyGamma(gray, gamma) {
  if (Math.abs(gamma - 1.0) < 0.01) return;
  const inv = 1 / gamma;
  for (let i = 0; i < gray.length; i++) {
    gray[i] = Math.pow(Math.max(0, Math.min(1, gray[i])), inv);
  }
}

function contrastStretch(gray) {
  const bins = new Uint32Array(256);
  for (let i = 0; i < gray.length; i++) {
    const b = Math.max(0, Math.min(255, Math.round(gray[i] * 255)));
    bins[b]++;
  }
  const total = gray.length;
  const lowTarget  = total * 0.02;
  const highTarget = total * 0.98;
  let acc = 0, lo = 0, hi = 255;
  for (let i = 0; i < 256; i++) {
    acc += bins[i];
    if (acc >= lowTarget) { lo = i; break; }
  }
  acc = 0;
  for (let i = 0; i < 256; i++) {
    acc += bins[i];
    if (acc >= highTarget) { hi = i; break; }
  }
  if (hi <= lo) return;
  const loV = lo / 255;
  const hiV = hi / 255;
  const range = hiV - loV;
  for (let i = 0; i < gray.length; i++) {
    let v = (gray[i] - loV) / range;
    if (v < 0) v = 0;
    if (v > 1) v = 1;
    gray[i] = v;
  }
}

function gaussianBlur3(gray, w, h) {
  const kernel = [0.27901, 0.44198, 0.27901];
  const tmp = new Float32Array(w * h);
  const out = new Float32Array(w * h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let sum = 0;
      for (let k = -1; k <= 1; k++) {
        const xx = x + k;
        if (xx < 0 || xx >= w) continue;
        sum += gray[y * w + xx] * kernel[k + 1];
      }
      tmp[y * w + x] = sum;
    }
  }
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let sum = 0;
      for (let k = -1; k <= 1; k++) {
        const yy = y + k;
        if (yy < 0 || yy >= h) continue;
        sum += tmp[yy * w + x] * kernel[k + 1];
      }
      out[y * w + x] = sum;
    }
  }
  return out;
}

function unsharpMask(gray, w, h, amount) {
  if (amount <= 0) return;
  const blurred = gaussianBlur3(gray, w, h);
  for (let i = 0; i < gray.length; i++) {
    let v = gray[i] + amount * (gray[i] - blurred[i]);
    if (v < 0) v = 0;
    if (v > 1) v = 1;
    gray[i] = v;
  }
}

function otsuThreshold(gray) {
  const bins = new Uint32Array(256);
  for (let i = 0; i < gray.length; i++) {
    const b = Math.max(0, Math.min(255, Math.round(gray[i] * 255)));
    bins[b]++;
  }
  const total = gray.length;
  let sum = 0;
  for (let i = 0; i < 256; i++) sum += i * bins[i];
  let sumB = 0, wB = 0, maxVar = 0, best = 128;
  for (let i = 0; i < 256; i++) {
    wB += bins[i];
    if (wB === 0) continue;
    const wF = total - wB;
    if (wF === 0) break;
    sumB += i * bins[i];
    const mB = sumB / wB;
    const mF = (sum - sumB) / wF;
    const between = wB * wF * (mB - mF) * (mB - mF);
    if (between > maxVar) { maxVar = between; best = i; }
  }
  return best;
}

const BAYER4 = [
  [ 0, 8, 2,10],
  [12, 4,14, 6],
  [ 3,11, 1, 9],
  [15, 7,13, 5],
].map(row => row.map(v => v / 16));

const BAYER8 = (() => {
  const b = [];
  for (let y = 0; y < 8; y++) {
    b.push([]);
    for (let x = 0; x < 8; x++) {
      const m4 = BAYER4[y % 4][x % 4];
      const quad = (Math.floor(y/4) * 2 + Math.floor(x/4));
      b[y].push((m4 * 4 + quad) / 16);
    }
  }
  return b;
})();

function thresholdValue(v, x, y, thresh, ditherMode) {
  switch (ditherMode) {
    case 'bayer4': {
      const t = thresh + (BAYER4[y & 3][x & 3] - 0.5) * 128;
      return v > t ? 255 : 0;
    }
    case 'bayer8': {
      const t = thresh + (BAYER8[y & 7][x & 7] - 0.5) * 128;
      return v > t ? 255 : 0;
    }
    default:
      return v > thresh ? 255 : 0;
  }
}

function grayToByte(gray) {
  const out = new Float32Array(gray.length);
  for (let i = 0; i < gray.length; i++) out[i] = gray[i] * 255;
  return out;
}

function ditherFS(gray255, w, h, thresh) {
  const out = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = y * w + x;
      const old = gray255[i];
      const nv = old > thresh ? 255 : 0;
      out[i] = nv;
      const err = old - nv;
      if (x + 1 < w) gray255[i + 1]       += err * 7/16;
      if (y + 1 < h) {
        if (x > 0)     gray255[i + w - 1] += err * 3/16;
                       gray255[i + w]     += err * 5/16;
        if (x + 1 < w) gray255[i + w + 1] += err * 1/16;
      }
    }
  }
  return out;
}

function ditherAtkinson(gray255, w, h, thresh) {
  const out = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = y * w + x;
      const old = gray255[i];
      const nv = old > thresh ? 255 : 0;
      out[i] = nv;
      const err = (old - nv) / 8;
      const push = (xx, yy) => {
        if (xx >= 0 && xx < w && yy >= 0 && yy < h) gray255[yy * w + xx] += err;
      };
      push(x + 1, y); push(x + 2, y);
      push(x - 1, y + 1); push(x, y + 1); push(x + 1, y + 1);
      push(x, y + 2);
    }
  }
  return out;
}

function processFrame(src, srcW, srcH, srcIsRgbaArray) {
  const down = document.getElementById('downsample').value;
  const ditherMode = document.getElementById('dither').value;
  const doStretch = document.getElementById('stretch').checked;
  const gamma = parseFloat(document.getElementById('gamma').value) || 1;
  const sharpen = parseFloat(document.getElementById('sharpen').value) || 0;
  const autoThresh = document.getElementById('autoThresh').checked;
  const manualThresh = parseInt(document.getElementById('threshold').value, 10);
  const invert = document.getElementById('invert').checked;

  let rgb;
  let srcData = null;
  if (down === 'lanczos' || down === 'area') {
    if (srcIsRgbaArray) {
      srcData = src;
    } else {
      const c = src.getContext('2d', { willReadFrequently: true });
      srcData = c.getImageData(0, 0, srcW, srcH).data;
    }
  }

  if (down === 'lanczos') {
    rgb = lanczosDownsample(srcData, srcW, srcH);
  } else if (down === 'area') {
    rgb = areaDownsample(srcData, srcW, srcH);
  } else {
    rgb = bilinearDownsample(src, srcW, srcH, srcIsRgbaArray);
  }

  const gray = rgbToGrayLinear(rgb, invert);
  if (doStretch) contrastStretch(gray);
  applyGamma(gray, gamma);
  if (sharpen > 0) unsharpMask(gray, OUT_W, OUT_H, sharpen);

  let threshByte = manualThresh;
  if (autoThresh) threshByte = otsuThreshold(gray);

  const gray255 = grayToByte(gray);
  let bitmap;
  if (ditherMode === 'fs') bitmap = ditherFS(gray255, OUT_W, OUT_H, threshByte);
  else if (ditherMode === 'atkinson') bitmap = ditherAtkinson(gray255, OUT_W, OUT_H, threshByte);
  else {
    bitmap = new Uint8Array(OUT_W * OUT_H);
    for (let y = 0; y < OUT_H; y++) {
      for (let x = 0; x < OUT_W; x++) {
        const i = y * OUT_W + x;
        bitmap[i] = thresholdValue(gray255[i], x, y, threshByte, ditherMode);
      }
    }
  }

  return bitmap;
}

function renderBitFrame(context, bitmap, scale) {
  context.fillStyle = '#000';
  context.fillRect(0, 0, OUT_W * scale, OUT_H * scale);
  context.fillStyle = '#fff';
  for (let y = 0; y < OUT_H; y++) {
    for (let x = 0; x < OUT_W; x++) {
      if (bitmap[y * OUT_W + x]) {
        context.fillRect(x * scale, y * scale, scale, scale);
      }
    }
  }
}

function stopPlayback() {
  if (playbackTimer) {
    clearTimeout(playbackTimer);
    playbackTimer = null;
  }
}

function extractVideoFrameAt(t) {
  return new Promise((resolve) => {
    const onSeeked = () => {
      video.removeEventListener('seeked', onSeeked);
      const tmp = document.createElement('canvas');
      tmp.width = video.videoWidth;
      tmp.height = video.videoHeight;
      tmp.getContext('2d').drawImage(video, 0, 0);
      resolve(tmp);
    };
    video.addEventListener('seeked', onSeeked);
    video.currentTime = t;
  });
}

document.getElementById('btnConvert').onclick = async () => {
  stopPlayback();
  if (!currentKind) {
    statusEl.textContent = 'Load a file first.';
    return;
  }

  const start = parseFloat(document.getElementById('start').value) || 0;
  const length = Math.min(parseFloat(document.getElementById('length').value) || 5, 10);
  const fps = Math.min(parseInt(document.getElementById('fps').value, 10) || 8, 12);

  const frameCount = Math.round(length * fps);
  const dt = 1 / fps;
  const bitmaps = [];
  framesDiv.innerHTML = '';

  if (currentKind === 'gif') {
    const t0 = start * 1000;
    const t1 = Math.min((start + length) * 1000, gifTotalMs);
    for (let i = 0; i < frameCount; i++) {
      const tMs = t0 + i * (dt * 1000);
      if (tMs > t1) break;
      let acc = 0, idx = 0;
      for (let j = 0; j < gifFrames.length; j++) {
        acc += gifFrames[j].delayMs;
        if (acc > tMs) { idx = j; break; }
        idx = j;
      }
      const gf = gifFrames[idx];
      const bitmap = processFrame(gf.rgba, gf.width, gf.height, true);
      bitmaps.push(bitmap);
      const c = document.createElement('canvas');
      c.width = OUT_W; c.height = OUT_H;
      renderBitFrame(c.getContext('2d'), bitmap, 1);
      framesDiv.appendChild(c);
      statusEl.textContent = `Processing GIF ${i + 1} / ${frameCount}…`;
      await new Promise(r => setTimeout(r, 0));
    }
  } else {
    for (let i = 0; i < frameCount; i++) {
      const t = start + i * dt;
      if (t > video.duration) break;
      statusEl.textContent = `Processing ${i + 1} / ${frameCount}…`;
      const src = await extractVideoFrameAt(t);
      const bitmap = processFrame(src, src.width, src.height, false);
      bitmaps.push(bitmap);
      const c = document.createElement('canvas');
      c.width = OUT_W; c.height = OUT_H;
      renderBitFrame(c.getContext('2d'), bitmap, 1);
      framesDiv.appendChild(c);
    }
  }

  statusEl.textContent = `Done — ${bitmaps.length} frames.`;
  const loopPreview = document.getElementById('loopPreview').checked;
  const frameMs = 1000 / fps;
  let idx = 0;
  const tick = () => {
    renderBitFrame(outCtx, bitmaps[idx], SCALE);
    idx++;
    if (idx >= bitmaps.length) {
      if (!loopPreview) return;
      idx = 0;
    }
    playbackTimer = setTimeout(tick, frameMs);
  };
  tick();
};

function debouncedConvert() {
  if (window._convertDebounce) clearTimeout(window._convertDebounce);
  window._convertDebounce = setTimeout(() => {
    drawCropOverlay();
    document.getElementById('btnConvert').click();
  }, 150);
}

['cropX', 'cropY', 'zoom', 'threshold', 'dither', 'invert',
 'stretch', 'gamma', 'sharpen', 'autoThresh', 'downsample'].forEach(id => {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('input', debouncedConvert);
  if (el.tagName === 'SELECT') el.addEventListener('change', debouncedConvert);
});
</script>
